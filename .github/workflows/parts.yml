# One part per PR (CONTRIBUTING.md rule 1) and content isolation (PLAN.md 5.5).
# The PR's part label decides which paths it may touch; docs, CHANGELOG and the status board are always allowed.
name: parts
on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]
jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed paths against the part label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case " $LABELS " in
            *" content "*)  allowed='^(content/problems/|content/packs/[^/]+/pack\.json$)' ;;
            *" engine "*)   allowed='^(engine/|shared-java/)' ;;
            *" desktop "*)  allowed='^desktop/' ;;
            *" web "*)      allowed='^web/' ;;
            *" packages "*) allowed='^packages/' ;;
            *" language "*) allowed='^languages/' ;;
            *" section "*)  allowed='^sections/' ;;
            *" backend "*)  allowed='^backend/' ;;
            *) echo "Add exactly one part label (CONTRIBUTING.md rule 1)."; exit 1 ;;
          esac
          # Content PRs get no extras: only problem folders and pack.json (PLAN.md 5.5).
          always='^(docs/|CHANGELOG\.md$)'
          case " $LABELS " in *" content "*) always='^$' ;; esac
          bad=$(git diff --name-only "$BASE"...HEAD | grep -Ev "$allowed" | grep -Ev "$always" || true)
          if [ -n "$bad" ]; then echo "Outside this PR's part:"; echo "$bad"; exit 1; fi
