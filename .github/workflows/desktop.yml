# Desktop shell gates on both operating systems, and unsigned installers from a version tag
# (Phase 1a exit criterion 5). Signing and notarisation arrive in Phase 1c. macOS builds on every run but may
# fail without blocking (ADR 0007: Windows first; macOS is hand-tested when a machine is available).
name: desktop
on:
  pull_request:
    paths: ['desktop/**', 'engine/**', 'languages/**', 'sections/**', 'packages/**', 'shared-java/**']
  push:
    branches: [main]
    # Releases are tagged per deployable (PLAN.md: semantic versioning per deployable), e.g. app-v0.1.0.
    tags: ['app-v*']
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  installers:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      # engine.jar, the jlink runtime from the Temurin JDK above, then tauri build: NSIS or DMG.
      - run: pnpm -C desktop build
      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.os }}
          # A green run must mean an installer exists.
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
