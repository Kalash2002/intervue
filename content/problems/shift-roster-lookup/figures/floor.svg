<text x="206" y="134" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">insertion point of 700 is 2</text>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f"><text x="40" y="170">binarySearch(starts, 700) = -3</text><text x="40" y="192">insertion point = -(-3) - 1 = 2, floor = 2 - 1 = 1</text></g>
