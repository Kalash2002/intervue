<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img">

<text x="20" y="28" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">line</text>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<rect x="80" y="12" width="36" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/><text x="92" y="31">(</text><text x="92" y="58" font-size="11">0</text>
<rect x="124" y="12" width="36" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/><text x="136" y="31">[</text><text x="136" y="58" font-size="11">1</text>
<rect x="168" y="12" width="36" height="28" fill="#7c3aed" stroke="#7c3aed"/><text x="180" y="31" fill="#ffffff">)</text><text x="180" y="58" font-size="11">2</text>
<rect x="212" y="12" width="36" height="28" fill="none" stroke="#83748f" stroke-width="1.5" stroke-dasharray="4 3"/><text x="224" y="31">]</text><text x="224" y="58" font-size="11">3</text>
</g>
<text x="20" y="100" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">stack of columns, top on the right</text>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="20" y="140">after (</text><rect x="110" y="120" width="30" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/><text x="121" y="139">0</text>
<text x="20" y="180">after [</text><rect x="110" y="160" width="30" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/><text x="121" y="179">0</text><rect x="146" y="160" width="30" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/><text x="157" y="179">1</text>
<text x="20" y="220">at )</text><rect x="110" y="200" width="30" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/><text x="121" y="219">0</text><rect x="146" y="200" width="30" height="28" fill="#7c3aed" stroke="#7c3aed"/><text x="157" y="219" fill="#ffffff">1</text>
</g>
<text x="300" y="140" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">push the column of every opener</text>
<text x="300" y="180" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">a closer looks at the top only</text>
<text x="300" y="220" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">top is [ at column 1, closer is ): MISMATCH at 2</text>

</svg>
