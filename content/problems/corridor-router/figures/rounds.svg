<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">

<g stroke="#83748f" stroke-width="1.5" fill="none">
<circle cx="70" cy="60" r="18"/><circle cx="200" cy="60" r="18"/><circle cx="330" cy="60" r="18"/><circle cx="200" cy="150" r="18"/>
<line x1="88" y1="60" x2="182" y2="60"/><line x1="218" y1="60" x2="312" y2="60"/><line x1="84" y1="72" x2="186" y2="140"/><line x1="214" y1="140" x2="316" y2="72"/>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="middle"><text x="70" y="65">A</text><text x="200" y="65">B</text><text x="330" y="65">C</text><text x="200" y="155">D</text>
<text x="135" y="52">4</text><text x="265" y="52">3</text><text x="120" y="118">1</text><text x="285" y="118">1</text></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="400" y="40">round  A  B  C  D</text>
<text x="400" y="66">0      0  -  -  -</text>
<text x="400" y="92">1      0  4  -  1</text>
<text x="400" y="118" fill="#7c3aed">2      0  4  7  1</text>
<text x="400" y="144">3      0  4  2  1</text>
</g>
<text x="400" y="180" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">maxHops = 2: answer 7 via B</text>
<text x="400" y="202" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">A, D, C costs 2 but needs 3 hops</text>
<text x="20" y="215" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">Dijkstra would settle C at 2 and never</text>
<text x="20" y="235" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">revisit it; the hop limit needs the rounds.</text>

</svg>
