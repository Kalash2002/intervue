<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="196">Sorted once, the names with a prefix are one block, and the first 3 of it show.</text>
<text x="20" y="218">The block for k and for ki holds four names, so the last one is cut off.</text>
<text x="20" y="240">The block for kit is kit, kite: kit equals the prefix, so it comes first.</text>
