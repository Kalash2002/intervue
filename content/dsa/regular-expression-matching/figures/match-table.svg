<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img">
<title>Regular Expression Matching, Example 1: which rests of toast match which rests of to.a*st</title>
<text x="20" y="22" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">text = toast down the side, pattern = to.a*st along the top, filled from the end</text>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle"><text x="130" y="56">t</text><text x="174" y="56">o</text><text x="218" y="56">.</text><text x="262" y="56">a</text><text x="306" y="56">*</text><text x="350" y="56">s</text><text x="394" y="56">t</text><text x="96" y="83">t</text><text x="96" y="111">o</text><text x="96" y="139">a</text><text x="96" y="167">s</text><text x="96" y="195">t</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="11" fill="#83748f" text-anchor="middle"><text x="438" y="56">end</text><text x="94" y="222">end</text></g>
<g fill="none" stroke="#83748f" stroke-width="1"><rect x="154" y="66" width="40" height="24"/><rect x="198" y="66" width="40" height="24"/><rect x="242" y="66" width="40" height="24"/><rect x="330" y="66" width="40" height="24"/><rect x="374" y="66" width="40" height="24"/><rect x="418" y="66" width="40" height="24"/><rect x="110" y="94" width="40" height="24"/><rect x="198" y="94" width="40" height="24"/><rect x="242" y="94" width="40" height="24"/><rect x="330" y="94" width="40" height="24"/><rect x="374" y="94" width="40" height="24"/><rect x="418" y="94" width="40" height="24"/><rect x="110" y="122" width="40" height="24"/><rect x="154" y="122" width="40" height="24"/><rect x="242" y="122" width="40" height="24"/><rect x="330" y="122" width="40" height="24"/><rect x="374" y="122" width="40" height="24"/><rect x="418" y="122" width="40" height="24"/><rect x="110" y="150" width="40" height="24"/><rect x="154" y="150" width="40" height="24"/><rect x="198" y="150" width="40" height="24"/><rect x="374" y="150" width="40" height="24"/><rect x="418" y="150" width="40" height="24"/><rect x="110" y="178" width="40" height="24"/><rect x="154" y="178" width="40" height="24"/><rect x="198" y="178" width="40" height="24"/><rect x="242" y="178" width="40" height="24"/><rect x="330" y="178" width="40" height="24"/><rect x="418" y="178" width="40" height="24"/><rect x="110" y="206" width="40" height="24"/><rect x="154" y="206" width="40" height="24"/><rect x="198" y="206" width="40" height="24"/><rect x="242" y="206" width="40" height="24"/><rect x="330" y="206" width="40" height="24"/><rect x="374" y="206" width="40" height="24"/></g>
<g fill="none" stroke="#83748f" stroke-width="1" stroke-dasharray="3 3"><rect x="286" y="66" width="40" height="24"/><rect x="286" y="94" width="40" height="24"/><rect x="286" y="122" width="40" height="24"/><rect x="286" y="150" width="40" height="24"/><rect x="286" y="178" width="40" height="24"/><rect x="286" y="206" width="40" height="24"/></g>
<g fill="none" stroke="#83748f" stroke-width="2.5"><rect x="154" y="94" width="40" height="24"/><rect x="198" y="122" width="40" height="24"/><rect x="242" y="150" width="40" height="24"/><rect x="330" y="150" width="40" height="24"/><rect x="374" y="178" width="40" height="24"/><rect x="418" y="206" width="40" height="24"/></g>
<rect x="110" y="66" width="40" height="24" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle"><text x="130" y="83" fill="#ffffff">T</text><text x="174" y="83">F</text><text x="218" y="83">F</text><text x="262" y="83">F</text><text x="350" y="83">F</text><text x="394" y="83">F</text><text x="438" y="83">F</text><text x="130" y="111">F</text><text x="174" y="111">T</text><text x="218" y="111">T</text><text x="262" y="111">F</text><text x="350" y="111">F</text><text x="394" y="111">F</text><text x="438" y="111">F</text><text x="130" y="139">F</text><text x="174" y="139">F</text><text x="218" y="139">T</text><text x="262" y="139">T</text><text x="350" y="139">F</text><text x="394" y="139">F</text><text x="438" y="139">F</text><text x="130" y="167">F</text><text x="174" y="167">F</text><text x="218" y="167">F</text><text x="262" y="167">T</text><text x="350" y="167">T</text><text x="394" y="167">F</text><text x="438" y="167">F</text><text x="130" y="195">F</text><text x="174" y="195">F</text><text x="218" y="195">F</text><text x="262" y="195">F</text><text x="350" y="195">F</text><text x="394" y="195">T</text><text x="438" y="195">F</text><text x="130" y="223">F</text><text x="174" y="223">F</text><text x="218" y="223">F</text><text x="262" y="223">F</text><text x="350" y="223">F</text><text x="394" y="223">F</text><text x="438" y="223">T</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="472" y="83">T: the text from this row</text><text x="472" y="101">on matches the pattern</text><text x="472" y="119">from this column on</text><text x="472" y="149">thick: the match; the dot</text><text x="472" y="167">takes the a, a* takes none,</text><text x="472" y="185">so that row skips two</text><text x="472" y="203">columns to the s</text><text x="472" y="233">dashed: a and * are one</text><text x="472" y="251">piece, so the star column</text><text x="472" y="269">is never read</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="20" y="294">A letter or dot on its own is T when its letter matches and the cell down and to the right is T.</text><text x="20" y="312">A starred piece is T when the cell two to its right is T (no copy), or its letter matches and the</text><text x="20" y="330">cell below is T (one more copy). The other two T cells, a* against ast and the dot against oast,</text><text x="20" y="348">are not on the way from the top-left.</text></g>
</svg>
