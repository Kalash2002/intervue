<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">
<title>Longest Substring on "kayakxyz": the window start and length after each end position; the best window is akxyz</title>

<g fill="none" stroke="#83748f" stroke-width="1.5"><rect x="150" y="36" width="50" height="32"/><rect x="206" y="36" width="50" height="32"/><rect x="262" y="36" width="50" height="32"/></g>
<g fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"><rect x="318" y="36" width="50" height="32"/><rect x="374" y="36" width="50" height="32"/><rect x="430" y="36" width="50" height="32"/><rect x="486" y="36" width="50" height="32"/><rect x="542" y="36" width="50" height="32"/></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle"><text x="175.0" y="57">k</text><text x="175.0" y="92">0</text><text x="175.0" y="130">0</text><text x="175.0" y="160">1</text><text x="231.0" y="57">a</text><text x="231.0" y="92">1</text><text x="231.0" y="130">0</text><text x="231.0" y="160">2</text><text x="287.0" y="57">y</text><text x="287.0" y="92">2</text><text x="287.0" y="130">0</text><text x="287.0" y="160">3</text><text x="343.0" y="57" fill="#ffffff">a</text><text x="343.0" y="92">3</text><text x="343.0" y="130">2</text><text x="343.0" y="160">2</text><text x="399.0" y="57" fill="#ffffff">k</text><text x="399.0" y="92">4</text><text x="399.0" y="130">2</text><text x="399.0" y="160">3</text><text x="455.0" y="57" fill="#ffffff">x</text><text x="455.0" y="92">5</text><text x="455.0" y="130">2</text><text x="455.0" y="160">4</text><text x="511.0" y="57" fill="#ffffff">y</text><text x="511.0" y="92">6</text><text x="511.0" y="130">3</text><text x="511.0" y="160">4</text><text x="567.0" y="57" fill="#ffffff">z</text><text x="567.0" y="92">7</text><text x="567.0" y="130">3</text><text x="567.0" y="160">5</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f"><text x="20" y="57">string</text><text x="20" y="92">position (end)</text><text x="20" y="130">start after it</text><text x="20" y="160">window length</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f"><text x="20" y="200">The second a moves the start from 0 to 2, and y moves it from 2 to 3.</text><text x="20" y="222">The k at position 4 leaves it at 2: its last copy is already behind.</text></g>
</svg>
