<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img">
<title>Longest Valid Parentheses on ()(()))(): the open and close counters of the left-to-right pass after each character, with the stretch recorded when they are equal</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="28">i</text><text x="62" y="28">char</text><text x="130" y="28">open</text><text x="200" y="28">close</text><text x="280" y="28">event (left to right)</text>
</g>
<rect x="270" y="170" width="150" height="22" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="20" y="56">0</text><text x="70" y="56">(</text><text x="130" y="56">1</text><text x="200" y="56">0</text>
<text x="20" y="82">1</text><text x="70" y="82">)</text><text x="130" y="82">1</text><text x="200" y="82">1</text><text x="280" y="82">equal: 2</text>
<text x="20" y="108">2</text><text x="70" y="108">(</text><text x="130" y="108">2</text><text x="200" y="108">1</text>
<text x="20" y="134">3</text><text x="70" y="134">(</text><text x="130" y="134">3</text><text x="200" y="134">1</text>
<text x="20" y="160">4</text><text x="70" y="160">)</text><text x="130" y="160">3</text><text x="200" y="160">2</text>
<text x="20" y="186">5</text><text x="70" y="186">)</text><text x="130" y="186">3</text><text x="200" y="186">3</text><text x="280" y="186" fill="#ffffff">equal: 6</text>
<text x="20" y="212">6</text><text x="70" y="212">)</text><text x="130" y="212">3</text><text x="200" y="212">4</text><text x="280" y="212">close > open: reset</text>
<text x="20" y="238">7</text><text x="70" y="238">(</text><text x="130" y="238">1</text><text x="200" y="238">0</text>
<text x="20" y="264">8</text><text x="70" y="264">)</text><text x="130" y="264">1</text><text x="200" y="264">1</text><text x="280" y="264">equal: 2</text>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="300">The ) at 6 outnumbers the ( so far, so both counters reset.</text>
<text x="20" y="320">The right-to-left pass finds only 2, so the answer is 6.</text>
</g>
</svg>
