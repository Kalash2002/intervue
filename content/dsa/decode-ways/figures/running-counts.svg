<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img">
<title>Decode Ways, Example 1: the ways to read each prefix of 1726, ending at 4</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">digits = "1726": ways to read each prefix, counted from the empty start</text>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="200" y="40" width="60" height="32"/><rect x="260" y="40" width="60" height="32"/><rect x="320" y="40" width="60" height="32"/><rect x="380" y="40" width="60" height="32"/>
<rect x="180" y="96" width="40" height="26"/><rect x="240" y="96" width="40" height="26"/><rect x="300" y="96" width="40" height="26"/><rect x="360" y="96" width="40" height="26"/>
</g>
<rect x="420" y="96" width="40" height="26" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#83748f" text-anchor="middle">
<text x="230" y="62">1</text><text x="290" y="62">7</text><text x="350" y="62">2</text><text x="410" y="62">6</text>
<text x="200" y="114">1</text><text x="260" y="114">1</text><text x="320" y="114">2</text><text x="380" y="114">2</text>
<text x="440" y="114" fill="#ffffff">4</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="middle">
<text x="200" y="140">empty</text><text x="260" y="140">1</text><text x="320" y="140">17</text><text x="380" y="140">172</text><text x="440" y="140">1726</text>
</g>
<text x="20" y="114" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">ways so far</text>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">
<text x="20" y="176">1: on its own, 1 way</text>
<text x="20" y="198">17: 7 on its own (1) + the pair 17 (1) = 2</text>
<text x="330" y="176">172: 2 on its own (2); 72 is no letter</text>
<text x="330" y="198">1726: 6 on its own (2) + the pair 26 (2) = 4</text>
</g>
</svg>
