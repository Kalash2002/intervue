<text x="20" y="196" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">Each closer meets the latest open bracket and removes it.</text>
<text x="20" y="218" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">The stack is empty after the last character, so the string is balanced.</text>
