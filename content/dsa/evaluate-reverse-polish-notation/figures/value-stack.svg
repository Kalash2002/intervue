<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" width="640" height="232" role="img">
<title>Evaluate Reverse Polish Notation on 9 3 - 4 *: the value stack after each token, ending at 24</title>
<text x="80" y="30" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">9</text>
<rect x="45" y="102" width="70" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="80" y="121" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">9</text>
<path d="M 39 134 L 121 134" stroke="#83748f" stroke-width="1.5" fill="none"/>
<text x="80" y="156" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">push 9</text>
<text x="200" y="30" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">3</text>
<rect x="165" y="102" width="70" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="200" y="121" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">9</text>
<rect x="165" y="74" width="70" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="200" y="93" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">3</text>
<path d="M 159 134 L 241 134" stroke="#83748f" stroke-width="1.5" fill="none"/>
<text x="200" y="156" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">push 3</text>
<text x="320" y="30" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">-</text>
<rect x="285" y="102" width="70" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="320" y="121" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">6</text>
<path d="M 279 134 L 361 134" stroke="#83748f" stroke-width="1.5" fill="none"/>
<text x="320" y="156" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">9 - 3 = 6</text>
<text x="440" y="30" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">4</text>
<rect x="405" y="102" width="70" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="440" y="121" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">6</text>
<rect x="405" y="74" width="70" height="28" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="440" y="93" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">4</text>
<path d="M 399 134 L 481 134" stroke="#83748f" stroke-width="1.5" fill="none"/>
<text x="440" y="156" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">push 4</text>
<text x="560" y="30" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">*</text>
<rect x="525" y="102" width="70" height="28" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="560" y="121" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">24</text>
<path d="M 519 134 L 601 134" stroke="#83748f" stroke-width="1.5" fill="none"/>
<text x="560" y="156" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">6 * 4 = 24</text>
<text x="20" y="196" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">At the minus, 3 comes off first: it is the right operand, so the sum is 9 - 3.</text>
<text x="20" y="218" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">One value is left at the end, and it is the answer.</text>
</svg>
