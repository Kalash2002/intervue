<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img">
<title>N-Queens, Example 1: the first 6 by 6 placement, with the choice for row 3 explained by taken columns and diagonals</title>

<g stroke="#83748f" stroke-width="1.5" fill="none">
<rect x="40" y="20" width="180" height="180"/>
<path d="M 70 20 V 200 M 100 20 V 200 M 130 20 V 200 M 160 20 V 200 M 190 20 V 200"/>
<path d="M 40 50 H 220 M 40 80 H 220 M 40 110 H 220 M 40 140 H 220 M 40 170 H 220"/>
</g>
<rect x="41" y="111" width="28" height="28" fill="#7c3aed"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">
<text x="85" y="41">Q</text>
<text x="145" y="71">Q</text>
<text x="205" y="101">Q</text>
<text x="55" y="131" fill="#ffffff">Q</text>
<text x="115" y="161">Q</text>
<text x="175" y="191">Q</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="end">
<text x="32" y="39">0</text><text x="32" y="69">1</text><text x="32" y="99">2</text>
<text x="32" y="129">3</text><text x="32" y="159">4</text><text x="32" y="189">5</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="260" y="40">Row 3, queens above in columns 1, 3, 5:</text>
<text x="260" y="66">columns taken: 1, 3, 5</text>
<text x="260" y="88">row+col taken: 1, 4, 7</text>
<text x="260" y="110">row-col taken: -1, -2, -3</text>
<text x="260" y="136">col 0: free, place it</text>
<text x="260" y="158">col 4: row+col = 7, on row 2's diagonal</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="236">One queen per row; each square is checked against three arrays.</text>
<text x="20" y="258">Purple: the queen placed in row 3, column 0.</text>
</g>
</svg>
