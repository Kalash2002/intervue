<text x="20" y="208" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">A piece ends where the position reaches end, the farthest last position so far.</text>
<text x="20" y="226" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">At position 2 the f has no copies left, but end is already 4: no cut there.</text>
</svg>
