<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 304" width="640" height="304" role="img">
<title>Reverse Integer, Example 1: the digits of 58301 come off the end one at a time and build 1, 10, 103, 1038 and 10385</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="28">x</text><text x="120" y="28">x % 10</text><text x="210" y="28">reversed</text><text x="330" y="28">safe to grow?</text><text x="450" y="28">reversed * 10 + digit</text>
<text x="330" y="62">yes</text>
<text x="330" y="96">yes</text>
<text x="330" y="130">yes</text>
<text x="330" y="164">yes</text>
<text x="330" y="198">yes</text>
<text x="120" y="232">x is 0: the loop ends</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="20" y="62">58301</text><text x="120" y="62">1</text><text x="210" y="62">0</text>
<text x="20" y="96">5830</text><text x="120" y="96">0</text><text x="210" y="96">1</text>
<text x="20" y="130">583</text><text x="120" y="130">3</text><text x="210" y="130">10</text>
<text x="20" y="164">58</text><text x="120" y="164">8</text><text x="210" y="164">103</text>
<text x="20" y="198">5</text><text x="120" y="198">5</text><text x="210" y="198">1038</text>
<text x="20" y="232">0</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="450" y="44" width="90" height="26"/>
<rect x="450" y="78" width="90" height="26"/>
<rect x="450" y="112" width="90" height="26"/>
<rect x="450" y="146" width="90" height="26"/>
</g>
<rect x="450" y="180" width="90" height="26" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="495" y="62">1</text>
<text x="495" y="96">10</text>
<text x="495" y="130">103</text>
<text x="495" y="164">1038</text>
<text x="495" y="198" fill="#ffffff">10385</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="270">Before each step, reversed is compared with 214748364, which is</text>
<text x="20" y="290">Integer.MAX_VALUE / 10; it never comes close, so the answer is 10385.</text>
</g>
</svg>
