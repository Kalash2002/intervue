<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img">
<title>Coin Change, Example 1: the fewest coins for every total from 0 to 10 with coins 2, 5 and 6</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">coins = [2,5,6], amount = 10: the fewest coins for every total from 0 up</text>

<path d="M 268 110 Q 430 -10 592 110" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 476 110 Q 522 80 568 110" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 320 110 Q 450 30 580 110" stroke="#7c3aed" stroke-width="2.5" fill="none"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="end">
<text x="264" y="104">+6</text><text x="316" y="104">+5</text><text x="472" y="104">+2</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="34" y="110" width="52" height="30"/><rect x="86" y="110" width="52" height="30"/><rect x="138" y="110" width="52" height="30"/><rect x="190" y="110" width="52" height="30"/><rect x="242" y="110" width="52" height="30"/>
<rect x="294" y="110" width="52" height="30"/><rect x="346" y="110" width="52" height="30"/><rect x="398" y="110" width="52" height="30"/><rect x="450" y="110" width="52" height="30"/><rect x="502" y="110" width="52" height="30"/>
</g>
<rect x="554" y="110" width="52" height="30" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="60" y="130">0</text><text x="112" y="130">–</text><text x="164" y="130">1</text><text x="216" y="130">–</text><text x="268" y="130">2</text>
<text x="320" y="130">1</text><text x="372" y="130">1</text><text x="424" y="130">2</text><text x="476" y="130">2</text><text x="528" y="130">3</text>
<text x="580" y="130" fill="#ffffff">2</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="middle">
<text x="60" y="156">0</text><text x="112" y="156">1</text><text x="164" y="156">2</text><text x="216" y="156">3</text><text x="268" y="156">4</text>
<text x="320" y="156">5</text><text x="372" y="156">6</text><text x="424" y="156">7</text><text x="476" y="156">8</text><text x="528" y="156">9</text>
<text x="580" y="156">10</text>
</g>

<text x="20" y="188" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">fewest[10] = 1 + min(fewest[8], fewest[5], fewest[4]) = 1 + min(2, 1, 2) = 2</text>
<text x="20" y="212" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">Totals under each cell; a dash marks a total that no coins add up to (1 and 3).</text>
</svg>
