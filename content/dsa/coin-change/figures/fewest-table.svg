<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img">
<title>Coin Change, Example 1: the fewest coins for every total from 0 to 14 with coins 2, 7 and 10</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">coins = [2,7,10], amount = 14: the fewest coins for every total from 0 up</text>

<path d="M 200 110 Q 406 -10 612 110" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 520 110 Q 554 80 588 110" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 320 110 Q 460 30 600 110" stroke="#7c3aed" stroke-width="2.5" fill="none"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="end">
<text x="196" y="104">+10</text><text x="316" y="104">+7</text><text x="516" y="104">+2</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="20" y="110" width="40" height="30"/><rect x="60" y="110" width="40" height="30"/><rect x="100" y="110" width="40" height="30"/><rect x="140" y="110" width="40" height="30"/><rect x="180" y="110" width="40" height="30"/>
<rect x="220" y="110" width="40" height="30"/><rect x="260" y="110" width="40" height="30"/><rect x="300" y="110" width="40" height="30"/><rect x="340" y="110" width="40" height="30"/><rect x="380" y="110" width="40" height="30"/>
<rect x="420" y="110" width="40" height="30"/><rect x="460" y="110" width="40" height="30"/><rect x="500" y="110" width="40" height="30"/><rect x="540" y="110" width="40" height="30"/>
</g>
<rect x="580" y="110" width="40" height="30" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="40" y="130">0</text><text x="80" y="130">–</text><text x="120" y="130">1</text><text x="160" y="130">–</text><text x="200" y="130">2</text>
<text x="240" y="130">–</text><text x="280" y="130">3</text><text x="320" y="130">1</text><text x="360" y="130">4</text><text x="400" y="130">2</text>
<text x="440" y="130">1</text><text x="480" y="130">3</text><text x="520" y="130">2</text><text x="560" y="130">4</text>
<text x="600" y="130" fill="#ffffff">2</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="middle">
<text x="40" y="156">0</text><text x="80" y="156">1</text><text x="120" y="156">2</text><text x="160" y="156">3</text><text x="200" y="156">4</text>
<text x="240" y="156">5</text><text x="280" y="156">6</text><text x="320" y="156">7</text><text x="360" y="156">8</text><text x="400" y="156">9</text>
<text x="440" y="156">10</text><text x="480" y="156">11</text><text x="520" y="156">12</text><text x="560" y="156">13</text><text x="600" y="156">14</text>
</g>

<text x="20" y="188" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">fewest[14] = 1 + min(fewest[12], fewest[7], fewest[4]) = 1 + min(2, 1, 2) = 2</text>
<text x="20" y="212" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">Totals under each cell; a dash marks a total that no coins add up to (1, 3 and 5).</text>
</svg>
