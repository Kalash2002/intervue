<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
<title>Palindromic Substrings, Example 1: how far each middle of tatty grows, 7 in total</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">s = "tatty": each middle counts one palindrome per step it can grow</text>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="180" y="36" width="56" height="32"/><rect x="236" y="36" width="56" height="32"/><rect x="292" y="36" width="56" height="32"/><rect x="348" y="36" width="56" height="32"/><rect x="404" y="36" width="56" height="32"/>
<rect x="194" y="84" width="28" height="22"/><rect x="250" y="84" width="28" height="22"/><rect x="306" y="84" width="28" height="22"/><rect x="362" y="84" width="28" height="22"/><rect x="418" y="84" width="28" height="22"/>
</g>
<g fill="none" stroke="#83748f" stroke-width="1.5" stroke-dasharray="4 3">
<rect x="222" y="136" width="28" height="22"/><rect x="278" y="136" width="28" height="22"/><rect x="334" y="136" width="28" height="22"/><rect x="390" y="136" width="28" height="22"/>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="100">letter middles</text>
<text x="20" y="152">gap middles</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="208" y="58">t</text><text x="264" y="58">a</text><text x="320" y="58">t</text><text x="376" y="58">t</text><text x="432" y="58">y</text>
<text x="208" y="100">1</text><text x="264" y="100">2</text><text x="320" y="100">1</text><text x="376" y="100">1</text><text x="432" y="100">1</text>
<text x="236" y="152">0</text><text x="292" y="152">0</text><text x="348" y="152">1</text><text x="404" y="152">0</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="middle">
<text x="208" y="122">t</text><text x="264" y="122">a, tat</text><text x="320" y="122">t</text><text x="376" y="122">t</text><text x="432" y="122">y</text>
<text x="348" y="174">tt</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="20" y="208">letters: 1 + 2 + 1 + 1 + 1 = 6</text>
<text x="280" y="208">gaps: 0 + 0 + 1 + 0 = 1</text>
</g>
<rect x="480" y="190" width="120" height="26" rx="4" fill="#7c3aed"/>
<text x="540" y="208" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">total 7</text>
</svg>
