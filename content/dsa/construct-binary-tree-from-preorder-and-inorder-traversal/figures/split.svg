<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">
<title>Example 1: 14 is first in pre-order, and in in-order it splits the values into the left subtree 8, -3, 19, 40 and the right subtree 27, 6</title>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">
<text x="20" y="45" text-anchor="start" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13">pre-order</text>
<rect x="100" y="25" width="40" height="30" fill="#7c3aed" stroke="#7c3aed"/>
<text x="120" y="45" fill="#ffffff">14</text>
<rect x="140" y="25" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="160" y="45">-3</text>
<rect x="180" y="25" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="200" y="45">8</text>
<rect x="220" y="25" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="240" y="45">40</text>
<rect x="260" y="25" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="280" y="45">19</text>
<rect x="300" y="25" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="320" y="45">27</text>
<rect x="340" y="25" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="360" y="45">6</text>
<text x="20" y="145" text-anchor="start" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13">in-order</text>
<rect x="100" y="125" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="120" y="145">8</text>
<rect x="140" y="125" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="160" y="145">-3</text>
<rect x="180" y="125" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="200" y="145">19</text>
<rect x="220" y="125" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="240" y="145">40</text>
<rect x="260" y="125" width="40" height="30" fill="#7c3aed" stroke="#7c3aed"/>
<text x="280" y="145" fill="#ffffff">14</text>
<rect x="300" y="125" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="320" y="145">27</text>
<rect x="340" y="125" width="40" height="30" fill="none" stroke="#83748f"/>
<text x="360" y="145">6</text>
</g>
<g stroke="#83748f" stroke-width="1.5" fill="none">
<path d="M142 63 v6 h156 v-6"/>
<path d="M302 63 v6 h76 v-6"/>
<path d="M102 163 v6 h156 v-6"/>
<path d="M302 163 v6 h76 v-6"/>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#83748f">
<text x="220" y="87">left: next 4 values</text>
<text x="340" y="87">right</text>
<text x="180" y="187">left subtree: 4 values</text>
<text x="340" y="187">right: 2</text>
<text x="240" y="225">the root comes first in pre-order and sits between its subtrees in in-order</text>
</g>
<g stroke="#83748f" stroke-width="1.5">
<line x1="511" y1="35" x2="474" y2="61"/>
<line x1="529" y1="35" x2="566" y2="61"/>
<line x1="459" y1="83" x2="442" y2="107"/>
<line x1="471" y1="83" x2="488" y2="107"/>
<line x1="576" y1="83" x2="593" y2="107"/>
<line x1="490" y1="132" x2="478" y2="155"/>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" text-anchor="middle" fill="#83748f">
<circle cx="520" cy="25" r="14" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="520" y="30" fill="#ffffff">14</text>
<circle cx="465" cy="72" r="14" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="465" y="77">-3</text>
<circle cx="575" cy="72" r="14" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="575" y="77">27</text>
<circle cx="436" cy="120" r="14" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="436" y="125">8</text>
<circle cx="494" cy="120" r="14" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="494" y="125">40</text>
<circle cx="600" cy="120" r="14" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="600" y="125">6</text>
<circle cx="472" cy="168" r="14" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="472" y="173">19</text>
</g>
</svg>
