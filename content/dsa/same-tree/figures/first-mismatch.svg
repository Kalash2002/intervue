<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img">
<title>Example 2 side by side: the walks agree on 7 and 2, then the left child of 2 is empty in p but holds 4 in q</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#83748f"/></marker></defs>
<text x="160" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="middle">p</text>
<text x="480" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="middle">q</text>
<line x1="148.7" y1="71.3" x2="111.3" y2="108.7" stroke="#83748f" stroke-width="1.5"/>
<line x1="171.3" y1="71.3" x2="208.7" y2="108.7" stroke="#83748f" stroke-width="1.5"/>
<line x1="107.2" y1="134.3" x2="122.8" y2="165.7" stroke="#83748f" stroke-width="1.5"/>
<circle cx="160" cy="60" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="160" y="65" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">7</text>
<circle cx="100" cy="120" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="100" y="125" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">2</text>
<circle cx="220" cy="120" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="220" y="125" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">9</text>
<circle cx="130" cy="180" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="130" y="185" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">4</text>
<line x1="92.8" y1="134.3" x2="77.2" y2="165.7" stroke="#83748f" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="70" cy="180" r="16" fill="none" stroke="#83748f" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="70" y="214" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="middle">empty</text>
<line x1="468.7" y1="71.3" x2="431.3" y2="108.7" stroke="#83748f" stroke-width="1.5"/>
<line x1="491.3" y1="71.3" x2="528.7" y2="108.7" stroke="#83748f" stroke-width="1.5"/>
<line x1="412.8" y1="134.3" x2="397.2" y2="165.7" stroke="#83748f" stroke-width="1.5"/>
<circle cx="480" cy="60" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="480" y="65" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">7</text>
<circle cx="420" cy="120" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="420" y="125" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">2</text>
<circle cx="540" cy="120" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="540" y="125" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">9</text>
<circle cx="390" cy="180" r="16" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="390" y="185" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#ffffff">4</text>
<text x="320" y="116" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="middle">first difference:</text>
<text x="320" y="134" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="middle">left child of 2</text>
</svg>
