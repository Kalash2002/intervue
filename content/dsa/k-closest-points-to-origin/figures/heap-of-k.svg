<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">
<title>K Closest Points, Example 1 with k = 2: a max-heap of squared distances keeps the two closest points</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="24">points in input order, with x² + y²</text>
</g>
<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="20" y="36" width="130" height="30"/>
<rect x="170" y="36" width="130" height="30"/>
<rect x="320" y="36" width="130" height="30"/>
<rect x="470" y="36" width="130" height="30"/>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="85" y="56">[3,4]  25</text>
<text x="235" y="56">[-1,2]  5</text>
<text x="385" y="56">[6,-1]  37</text>
<text x="535" y="56">[0,-3]  9</text>
</g>

<path d="M 120 144 L 120 178" stroke="#83748f" stroke-width="1.5" fill="none"/>
<circle cx="120" cy="122" r="22" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<circle cx="120" cy="200" r="22" fill="none" stroke="#83748f" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle">
<text x="120" y="127" fill="#ffffff">9</text>
<text x="120" y="205" fill="#83748f">5</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="180" y="110">The heap after all four points, farthest on top.</text>
<text x="180" y="140">25 was on top until 9 arrived and pushed it out.</text>
<text x="180" y="170">37 went in and came straight back out, the farthest.</text>
<text x="180" y="200">Answer: [-1,2] (5) and [0,-3] (9).</text>
</g>
</svg>
