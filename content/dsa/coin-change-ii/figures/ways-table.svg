<path d="M 345 163 Q 469 200 593 165" stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#head)"/>
<text x="469" y="196" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="middle">+8</text>
<line x1="593" y1="129" x2="593" y2="137" stroke="#83748f" stroke-width="1.5" marker-end="url(#head)"/>
<text x="20" y="220" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">ways[16] = 1 (no 8s: the row above) + ways[8] = 2 (one more 8) = 3</text>
<text x="20" y="242" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">Each row adds one coin value to the row above, so every handful is counted once.</text>
