<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img">
<title>Longest Increasing Path in a Matrix, Example 1: each cell's height and the round in which the peel removes it</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">Example 1: the height of each cell, and the round in which the peel removes it</text>
<g fill="none" stroke="#83748f" stroke-width="1"><rect x="256" y="44" width="72" height="56"/><rect x="256" y="100" width="72" height="56"/><rect x="256" y="156" width="72" height="56"/></g>
<g fill="none" stroke="#83748f" stroke-width="2.5"><rect x="40" y="44" width="72" height="56"/><rect x="112" y="44" width="72" height="56"/><rect x="184" y="44" width="72" height="56"/><rect x="40" y="100" width="72" height="56"/><rect x="112" y="100" width="72" height="56"/><rect x="184" y="100" width="72" height="56"/><rect x="40" y="156" width="72" height="56"/><rect x="112" y="156" width="72" height="56"/></g>
<rect x="184" y="156" width="72" height="56" fill="#7c3aed" stroke="#7c3aed" stroke-width="2.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#83748f" text-anchor="middle"><text x="76" y="72">5</text><text x="148" y="72">6</text><text x="220" y="72">7</text><text x="292" y="72">2</text><text x="76" y="128">4</text><text x="148" y="128">9</text><text x="220" y="128">8</text><text x="292" y="128">1</text><text x="76" y="184">3</text><text x="148" y="184">2</text><text x="220" y="184" fill="#ffffff">0</text><text x="292" y="184">1</text></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="middle"><text x="76" y="92">round 5</text><text x="148" y="92">round 4</text><text x="220" y="92">round 3</text><text x="292" y="92">round 4</text><text x="76" y="148">round 6</text><text x="148" y="148">round 1</text><text x="220" y="148">round 2</text><text x="292" y="148">round 5</text><text x="76" y="204">round 7</text><text x="148" y="204">round 8</text><text x="220" y="204" fill="#ffffff">round 9</text><text x="292" y="204">round 1</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="352" y="64">large number: the height</text><text x="352" y="84">small: the round, which is the longest</text><text x="352" y="102">climb that starts on that cell</text><text x="352" y="132">round 1: the cells with nothing higher</text><text x="352" y="150">beside them, the 9 and the corner 1</text><text x="352" y="180">thick: the climb 0, 2, 3, 4, 5, 6, 7, 8, 9,</text><text x="352" y="198">its rounds counting down from 9 to 1</text></g>
<text x="20" y="244" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">Nine rounds peel the whole grid, so the longest climb has 9 cells; it starts on the highlighted 0.</text>
</svg>
