<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
<title>Swim in Rising Water, Example 1: cells join the region lowest first, and the highest joined on the way to the goal is 7</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">elevation = {{1,8,3},{6,9,2},{7,5,4}}; a route costs its highest cell</text>
<rect x="40" y="50" width="56" height="56" rx="4" fill="none" stroke="#83748f" stroke-width="2.5"/>
<rect x="100" y="50" width="56" height="56" rx="4" fill="none" stroke="#83748f" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="160" y="50" width="56" height="56" rx="4" fill="none" stroke="#83748f" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="40" y="110" width="56" height="56" rx="4" fill="none" stroke="#83748f" stroke-width="2.5"/>
<rect x="100" y="110" width="56" height="56" rx="4" fill="none" stroke="#83748f" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="160" y="110" width="56" height="56" rx="4" fill="none" stroke="#83748f" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="40" y="170" width="56" height="56" rx="4" fill="#7c3aed"/>
<rect x="100" y="170" width="56" height="56" rx="4" fill="none" stroke="#83748f" stroke-width="2.5"/>
<rect x="160" y="170" width="56" height="56" rx="4" fill="none" stroke="#83748f" stroke-width="2.5"/>
<text x="68" y="84" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">1</text>
<text x="128" y="84" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">8</text>
<text x="188" y="84" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">3</text>
<text x="68" y="144" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">6</text>
<text x="128" y="144" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">9</text>
<text x="188" y="144" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">2</text>
<text x="68" y="204" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#ffffff" text-anchor="middle">7</text>
<text x="128" y="204" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">5</text>
<text x="188" y="204" font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">4</text>
<text x="260" y="62" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">pop order (time = highest cell so far):</text>
<text x="260" y="86" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">1 at time 1; queue 8 and 6</text>
<text x="260" y="108" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">6 at time 6; queue 9 and 7</text>
<text x="260" y="130" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">7 at time 7; queue 5 as time 7</text>
<text x="260" y="152" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">5 at time 7; queue 4 as time 7</text>
<text x="260" y="174" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">4 at time 7: the goal</text>
<text x="260" y="206" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="start">bold: the route; dashed: never popped; filled: the highest cell, 7</text>
</svg>
