<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img">
<title>Best Time to Buy and Sell Stock with Cooldown, Example 1: the best profit in each of three situations at the end of every day</title>
<text x="20" y="22" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">prices = [6,2,9,4,8,3,12]: the best profit so far at the end of each day</text>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="end"><text x="112" y="52">day</text><text x="112" y="76">price</text><text x="112" y="108">hold</text><text x="112" y="142">sold</text><text x="112" y="176">idle</text></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle"><text x="152" y="52" font-size="11">0</text><text x="152" y="76">6</text><text x="216" y="52" font-size="11">1</text><text x="216" y="76">2</text><text x="280" y="52" font-size="11">2</text><text x="280" y="76">9</text><text x="344" y="52" font-size="11">3</text><text x="344" y="76">4</text><text x="408" y="52" font-size="11">4</text><text x="408" y="76">8</text><text x="472" y="52" font-size="11">5</text><text x="472" y="76">3</text><text x="536" y="52" font-size="11">6</text><text x="536" y="76">12</text></g>
<g fill="none" stroke="#83748f" stroke-width="1"><rect x="124" y="90" width="56" height="26"/><rect x="252" y="90" width="56" height="26"/><rect x="316" y="90" width="56" height="26"/><rect x="380" y="90" width="56" height="26"/><rect x="508" y="90" width="56" height="26"/><rect x="124" y="124" width="56" height="26"/><rect x="188" y="124" width="56" height="26"/><rect x="316" y="124" width="56" height="26"/><rect x="380" y="124" width="56" height="26"/><rect x="444" y="124" width="56" height="26"/><rect x="188" y="158" width="56" height="26"/><rect x="252" y="158" width="56" height="26"/><rect x="444" y="158" width="56" height="26"/><rect x="508" y="158" width="56" height="26"/></g>
<g fill="none" stroke="#83748f" stroke-width="2.5"><rect x="188" y="90" width="56" height="26"/><rect x="444" y="90" width="56" height="26"/><rect x="252" y="124" width="56" height="26"/><rect x="124" y="158" width="56" height="26"/><rect x="316" y="158" width="56" height="26"/><rect x="380" y="158" width="56" height="26"/></g>
<rect x="508" y="124" width="56" height="26" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle"><text x="152" y="108">−6</text><text x="216" y="108">−2</text><text x="280" y="108">−2</text><text x="344" y="108">−2</text><text x="408" y="108">−1</text><text x="472" y="108">4</text><text x="536" y="108">4</text><text x="152" y="142">–</text><text x="216" y="142">−4</text><text x="280" y="142">7</text><text x="344" y="142">2</text><text x="408" y="142">6</text><text x="472" y="142">2</text><text x="536" y="142" fill="#ffffff">16</text><text x="152" y="176">0</text><text x="216" y="176">0</text><text x="280" y="176">0</text><text x="344" y="176">7</text><text x="408" y="176">7</text><text x="472" y="176">7</text><text x="536" y="176">7</text></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f"><text x="20" y="212">hold = max(hold, idle − price): keep the share, or buy if free</text><text x="20" y="230">sold = hold + price: sell the share; tomorrow is a rest day</text><text x="20" y="248">idle = max(idle, sold): wait, or sit out the day after a sale</text></g>
<text x="20" y="278" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">Thick: the best plan, 2 to 9, a rest day, then 3 to 12. A dash: nothing can have been sold yet.</text>
</svg>
