<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">
<title>Maximum Product Subarray, Example 1: the largest and smallest product of a run ending at each stage</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#83748f"/></marker></defs>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="36">stage</text>
<text x="20" y="64">gain</text>
<text x="20" y="105">high</text>
<text x="20" y="170">low</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">
<text x="160" y="36">0</text><text x="240" y="36">1</text><text x="320" y="36">2</text><text x="400" y="36">3</text><text x="480" y="36">4</text><text x="560" y="36">5</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="160" y="64">7</text><text x="240" y="64">-1</text><text x="320" y="64">2</text><text x="400" y="64">-3</text><text x="480" y="64">-2</text><text x="560" y="64">4</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="132" y="86" width="56" height="28"/><rect x="212" y="86" width="56" height="28"/><rect x="292" y="86" width="56" height="28"/><rect x="372" y="86" width="56" height="28"/><rect x="452" y="86" width="56" height="28"/>
<rect x="132" y="151" width="56" height="28"/><rect x="212" y="151" width="56" height="28"/><rect x="292" y="151" width="56" height="28"/><rect x="372" y="151" width="56" height="28"/><rect x="452" y="151" width="56" height="28"/><rect x="532" y="151" width="56" height="28"/>
</g>
<rect x="532" y="86" width="56" height="28" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<path d="M 350 150 L 368 117" stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 430 150 L 448 117" stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="160" y="105">7</text><text x="240" y="105">-1</text><text x="320" y="105">2</text><text x="400" y="105">42</text><text x="480" y="105">12</text>
<text x="560" y="105" fill="#ffffff">48</text>
<text x="160" y="170">7</text><text x="240" y="170">-7</text><text x="320" y="170">-14</text><text x="400" y="170">-6</text><text x="480" y="170">-84</text><text x="560" y="170">-336</text>
</g>

<text x="20" y="212" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">high at stage 5 = max(4, 12 × 4) = 48, above the 42 at stage 3</text>
<text x="20" y="236" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">Arrows: a negative gain turns the smallest product before it into the largest.</text>
</svg>
