<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img">
<title>Interleaving String, Example 1: which numbers of cards from lime and from leek can make the start of limleeke</title>
<text x="20" y="22" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">deck = limleeke: lime down the side, leek along the top</text>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle"><text x="264" y="56">l</text><text x="308" y="56">e</text><text x="352" y="56">e</text><text x="396" y="56">k</text><text x="186" y="111">l</text><text x="186" y="139">i</text><text x="186" y="167">m</text><text x="186" y="195">e</text></g>
<g fill="none" stroke="#83748f" stroke-width="1"><rect x="244" y="66" width="40" height="24"/><rect x="288" y="66" width="40" height="24"/><rect x="332" y="66" width="40" height="24"/><rect x="376" y="66" width="40" height="24"/><rect x="244" y="94" width="40" height="24"/><rect x="288" y="94" width="40" height="24"/><rect x="332" y="94" width="40" height="24"/><rect x="376" y="94" width="40" height="24"/><rect x="244" y="122" width="40" height="24"/><rect x="288" y="122" width="40" height="24"/><rect x="332" y="122" width="40" height="24"/><rect x="376" y="122" width="40" height="24"/><rect x="200" y="178" width="40" height="24"/><rect x="244" y="178" width="40" height="24"/><rect x="288" y="178" width="40" height="24"/><rect x="332" y="178" width="40" height="24"/></g>
<g fill="none" stroke="#83748f" stroke-width="2.5"><rect x="200" y="66" width="40" height="24"/><rect x="200" y="94" width="40" height="24"/><rect x="200" y="122" width="40" height="24"/><rect x="200" y="150" width="40" height="24"/><rect x="244" y="150" width="40" height="24"/><rect x="288" y="150" width="40" height="24"/><rect x="332" y="150" width="40" height="24"/><rect x="376" y="150" width="40" height="24"/></g>
<rect x="376" y="178" width="40" height="24" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle"><text x="220" y="83">T</text><text x="264" y="83">T</text><text x="308" y="83">F</text><text x="352" y="83">F</text><text x="396" y="83">F</text><text x="220" y="111">T</text><text x="264" y="111">F</text><text x="308" y="111">F</text><text x="352" y="111">F</text><text x="396" y="111">F</text><text x="220" y="139">T</text><text x="264" y="139">F</text><text x="308" y="139">F</text><text x="352" y="139">F</text><text x="396" y="139">F</text><text x="220" y="167">T</text><text x="264" y="167">T</text><text x="308" y="167">T</text><text x="352" y="167">T</text><text x="396" y="167">T</text><text x="220" y="195">F</text><text x="264" y="195">T</text><text x="308" y="195">T</text><text x="352" y="195">F</text><text x="396" y="195" fill="#ffffff">T</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="440" y="83">T: i cards of lime and j of leek</text><text x="440" y="101">make the first i + j of the deck</text><text x="440" y="131">thick: l, i, m from lime, then</text><text x="440" y="149">l, e, e, k from leek, then the</text><text x="440" y="167">last e from lime</text><text x="440" y="197">the other T cells are dead ends</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="20" y="232">The top-left cell, no cards from either pile, is T. Any other cell is T when the cell above</text><text x="20" y="250">is T and its lime card is the deck's next card, or the cell to its left is T and its leek card is.</text><text x="20" y="268">The corner is T, so the answer is true.</text></g>
</svg>
