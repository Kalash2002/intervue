<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="524" y="83">thick: the chain</text><text x="524" y="111">that spells codo</text></g>
<text x="20" y="284" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">c-c, o-o, d-d and o-o chain to 4: the subsequence codo</text>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="20" y="306">A cell whose two letters are equal is one more than the cell up and to the left;</text><text x="20" y="326">besides the thick chain, that holds for r-r, n-n and two more o-o cells.</text><text x="20" y="346">Every other cell keeps the larger of the cell above it and the cell to its left.</text></g>
</svg>
