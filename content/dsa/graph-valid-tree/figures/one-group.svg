<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img">
<title>Graph Valid Tree, Example 1: four pipes merge five valves into one group with no repeat</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">n = 5; pipes 3-0, 0-2, 2-4, 0-1; 4 pipes = n - 1, so the count passes</text>
<path d="M 100 90 L 180 90" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 220 90 L 300 90" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 340 90 L 420 90" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 200 110 L 200 170" stroke="#83748f" stroke-width="1.5" fill="none"/>
<circle cx="80" cy="90" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="80" y="95" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">3</text>
<circle cx="200" cy="90" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="200" y="95" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">0</text>
<circle cx="320" cy="90" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="320" y="95" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">2</text>
<circle cx="440" cy="90" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="440" y="95" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">4</text>
<circle cx="200" cy="190" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="200" y="195" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">1</text>
<text x="140" y="78" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">1st</text>
<text x="260" y="78" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">2nd</text>
<text x="380" y="78" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">3rd</text>
<text x="212" y="144" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">4th</text>
<text x="300" y="160" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">groups: 5, 4, 3, 2, 1</text>
<rect x="296" y="176" width="200" height="26" rx="4" fill="#7c3aed"/>
<text x="396" y="193" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">one group: true</text>
<text x="20" y="250" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">Every pipe joins two different groups, so no pipe closes a loop.</text>
</svg>
