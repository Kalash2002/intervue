<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
<title>Slow and fast pointers on [5,1,8,2] with the last node linking back to 1: they meet on 2 after three steps</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#83748f"/></marker></defs>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="140" y="30" width="48" height="28"/><rect x="230" y="30" width="48" height="28"/><rect x="320" y="30" width="48" height="28"/>
</g>
<rect x="410" y="30" width="48" height="28" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M 188 44 L 226 44"/><path d="M 278 44 L 316 44"/><path d="M 368 44 L 406 44"/>
<path d="M 434 60 Q 344 112 258 62"/>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="164" y="49">5</text><text x="254" y="49">1</text><text x="344" y="49">8</text><text x="434" y="49" fill="#ffffff">2</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">
<text x="164" y="22">0</text><text x="254" y="22">1</text><text x="344" y="22">2</text><text x="434" y="22">3</text>
<text x="344" y="104">pos = 1</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="140" y="138">step</text><text x="230" y="138">slow</text><text x="320" y="138">fast</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="140" y="160">0</text><text x="230" y="160">5</text><text x="320" y="160">5</text>
<text x="140" y="182">1</text><text x="230" y="182">1</text><text x="320" y="182">8</text>
<text x="140" y="204">2</text><text x="230" y="204">8</text><text x="320" y="204">1</text>
<text x="140" y="226">3</text><text x="230" y="226">2</text><text x="320" y="226">2</text>
</g>
<text x="400" y="226" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">same node: cycle</text>
</svg>
