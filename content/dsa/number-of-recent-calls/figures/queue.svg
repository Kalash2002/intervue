<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img">
<title>Number of Recent Calls with window 10 and calls at 4, 9, 14, 15 and 25: the queue of arrival times after each ping</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="24">ping</text><text x="90" y="24">cut-off t - 10</text><text x="210" y="24">dropped</text><text x="330" y="24">queue after (oldest first)</text><text x="550" y="24">answer</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="330" y="39" width="52" height="24"/>
<rect x="330" y="69" width="52" height="24"/><rect x="388" y="69" width="52" height="24"/>
<rect x="388" y="99" width="52" height="24"/><rect x="446" y="99" width="52" height="24"/>
<rect x="330" y="129" width="52" height="24"/><rect x="388" y="129" width="52" height="24"/><rect x="446" y="129" width="52" height="24"/>
<rect x="330" y="159" width="52" height="24"/><rect x="388" y="159" width="52" height="24"/>
</g>
<rect x="330" y="99" width="52" height="24" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="20" y="56">t=4</text><text x="90" y="56">-6</text><text x="210" y="56">none</text>
<text x="20" y="86">t=9</text><text x="90" y="86">-1</text><text x="210" y="86">none</text>
<text x="20" y="116">t=14</text><text x="90" y="116">4</text><text x="210" y="116">none</text>
<text x="20" y="146">t=15</text><text x="90" y="146">5</text><text x="210" y="146">4</text>
<text x="20" y="176">t=25</text><text x="90" y="176">15</text><text x="210" y="176">9, 14</text>
<text x="565" y="56">1</text><text x="565" y="86">2</text><text x="565" y="116">3</text><text x="565" y="146">3</text><text x="565" y="176">2</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="356" y="56">4</text>
<text x="356" y="86">4</text><text x="414" y="86">9</text>
<text x="356" y="146">9</text><text x="414" y="146">14</text><text x="472" y="146">15</text>
<text x="356" y="176">15</text><text x="414" y="176">25</text>
</g>

<text x="356" y="116" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">4</text>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="414" y="116">9</text><text x="472" y="116">14</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="214">At 14 the cut-off is 4 and the call at 4 is not older than that, so it stays.</text>
<text x="20" y="236">At 15 the cut-off is 5, so 4 leaves the front. Each time enters and leaves once.</text>
</g>
</svg>
