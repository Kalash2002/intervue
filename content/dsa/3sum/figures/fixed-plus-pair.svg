<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img">
<title>3Sum on [-4, 1, 3, 0, 2, -1, 4], sorted: each row fixes one value and finds a pair that cancels it</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f"><text x="20" y="26">sorted array; purple cells are the triple found, the left one is the fixed value</text></g>
<g fill="none" stroke="#83748f" stroke-width="1.5"><rect x="68" y="44" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="164" y="44" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="212" y="44" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="260" y="44" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="68" y="82" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="116" y="82" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="212" y="82" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="308" y="82" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="20" y="120" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="212" y="120" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="260" y="120" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="308" y="120" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="20" y="158" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="68" y="158" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="116" y="158" width="44" height="28"/><rect x="164" y="158" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="212" y="158" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="260" y="158" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/><rect x="308" y="158" width="44" height="28" stroke-dasharray="3 3" opacity="0.45"/></g>
<g fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"><rect x="20" y="44" width="44" height="28"/><rect x="116" y="44" width="44" height="28"/><rect x="308" y="44" width="44" height="28"/><rect x="20" y="82" width="44" height="28"/><rect x="164" y="82" width="44" height="28"/><rect x="260" y="82" width="44" height="28"/><rect x="68" y="120" width="44" height="28"/><rect x="116" y="120" width="44" height="28"/><rect x="164" y="120" width="44" height="28"/></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle"><text x="42.0" y="63" fill="#ffffff">-4</text><text x="90.0" y="63" opacity="0.45">-1</text><text x="138.0" y="63" fill="#ffffff">0</text><text x="186.0" y="63" opacity="0.45">1</text><text x="234.0" y="63" opacity="0.45">2</text><text x="282.0" y="63" opacity="0.45">3</text><text x="330.0" y="63" fill="#ffffff">4</text><text x="42.0" y="101" fill="#ffffff">-4</text><text x="90.0" y="101" opacity="0.45">-1</text><text x="138.0" y="101" opacity="0.45">0</text><text x="186.0" y="101" fill="#ffffff">1</text><text x="234.0" y="101" opacity="0.45">2</text><text x="282.0" y="101" fill="#ffffff">3</text><text x="330.0" y="101" opacity="0.45">4</text><text x="42.0" y="139" opacity="0.45">-4</text><text x="90.0" y="139" fill="#ffffff">-1</text><text x="138.0" y="139" fill="#ffffff">0</text><text x="186.0" y="139" fill="#ffffff">1</text><text x="234.0" y="139" opacity="0.45">2</text><text x="282.0" y="139" opacity="0.45">3</text><text x="330.0" y="139" opacity="0.45">4</text><text x="42.0" y="177" opacity="0.45">-4</text><text x="90.0" y="177" opacity="0.45">-1</text><text x="138.0" y="177">0</text><text x="186.0" y="177" opacity="0.45">1</text><text x="234.0" y="177" opacity="0.45">2</text><text x="282.0" y="177" opacity="0.45">3</text><text x="330.0" y="177" opacity="0.45">4</text></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f"><text x="365" y="63">-4 + 0 + 4 = 0</text><text x="365" y="101">-4 + 1 + 3 = 0</text><text x="365" y="139">-1 + 0 + 1 = 0</text><text x="365" y="177">fixed 0: no pair after it</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f"><text x="20" y="226">Rows 1 and 2 fix -4, row 3 fixes -1, row 4 fixes 0 and finds nothing.</text><text x="20" y="248">The next fixed value, 1, is positive, so the search stops.</text></g>
</svg>
