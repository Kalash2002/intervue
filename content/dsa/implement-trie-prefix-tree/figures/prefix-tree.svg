<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img">
<title>Trie after inserting tram, trap and tab: the walk for tra ends on a node that is not the end of a word</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f"><text x="20" y="22">one edge per letter; a double ring marks the end of an inserted word</text></g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<line x1="67.0" y1="115.0" x2="123.0" y2="115.0"/>
<line x1="155.5" y1="108.0" x2="224.5" y2="77.0"/>
<line x1="155.2" y1="122.6" x2="224.8" y2="157.4"/>
<line x1="257.0" y1="70.0" x2="323.0" y2="70.0"/>
<line x1="257.0" y1="165.0" x2="319.0" y2="165.0"/>
<line x1="356.3" y1="65.1" x2="419.9" y2="46.0"/>
<line x1="356.3" y1="74.9" x2="419.9" y2="94.0"/>
</g>
<g fill="none" stroke="#83748f" stroke-width="1.5">
<circle cx="50" cy="115" r="17"/>
<circle cx="140" cy="115" r="17"/>
<circle cx="240" cy="70" r="17"/>
<circle cx="240" cy="165" r="17"/>
<circle cx="340" cy="165" r="17"/>
<circle cx="340" cy="165" r="21"/>
<circle cx="440" cy="40" r="17"/>
<circle cx="440" cy="40" r="21"/>
<circle cx="440" cy="100" r="17"/>
<circle cx="440" cy="100" r="21"/>
</g>
<circle cx="340" cy="70" r="17" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#83748f" text-anchor="middle">
<text x="50" y="119" font-size="10">root</text>
<text x="140" y="120">t</text>
<text x="240" y="75">r</text>
<text x="240" y="170">a</text>
<text x="340" y="75" fill="#ffffff">a</text>
<text x="340" y="170">b</text>
<text x="440" y="45">m</text>
<text x="440" y="105">p</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="480" y="44">tram</text><text x="480" y="104">trap</text><text x="380" y="169">tab</text>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="214">Purple is the node the walk t, r, a reaches. It has no ring, so search(tra) is</text>
<text x="20" y="236">false, but the walk completed, so startsWith(tra) is true.</text>
</g>
</svg>
