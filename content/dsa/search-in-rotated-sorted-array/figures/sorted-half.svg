<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
<title>Search in Rotated Sorted Array on 27, 33, 40, 51, 2, 9, 15 with target 9: the left half is sorted and cannot hold 9, so the search goes right</title>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="80" y="36" width="52" height="32"/><rect x="140" y="36" width="52" height="32"/>
<rect x="200" y="36" width="52" height="32"/><rect x="260" y="36" width="52" height="32"/>
<rect x="320" y="36" width="52" height="32"/><rect x="440" y="36" width="52" height="32"/>
</g>
<rect x="380" y="36" width="52" height="32" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">
<text x="106" y="58">27</text><text x="166" y="58">33</text><text x="226" y="58">40</text><text x="286" y="58">51</text>
<text x="346" y="58">2</text><text x="406" y="58" fill="#ffffff">9</text><text x="466" y="58">15</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle" opacity="0.8">
<text x="106" y="86">0</text><text x="166" y="86">1</text><text x="226" y="86">2</text><text x="286" y="86">3</text>
<text x="346" y="86">4</text><text x="406" y="86">5</text><text x="466" y="86">6</text>
</g>

<g stroke="#83748f" stroke-width="1.5" fill="none">
<path d="M 80 104 L 312 104"/>
<path d="M 320 104 L 492 104" stroke-dasharray="6 4"/>
<path d="M 320 150 L 492 150"/>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="80" y="126">0..6, mid 3: [27..51] sorted, 9 not in it</text>
<text x="80" y="172">4..6, mid 5: holds 9, found</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="214">One half is always sorted: test the target against its ends.</text>
</g>
</svg>
