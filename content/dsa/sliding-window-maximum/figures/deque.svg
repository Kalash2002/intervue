<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" width="640" height="286" role="img">
<title>Sliding Window Maximum on [2, 9, 4, 1, 6, 3] with k = 3: the deque of candidates and the window maximum</title>
<text x="20" y="26" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">nums = [2, 9, 4, 1, 6, 3], k = 3; each box is value@position</text>
<text x="20" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">window 0..2</text>
<rect x="170" y="50" width="68" height="30" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="204" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">9@1</text>
<rect x="244" y="50" width="68" height="30" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="278" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">4@2</text>
<text x="420" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">max 9</text>
<text x="20" y="114" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">window 1..3</text>
<rect x="170" y="94" width="68" height="30" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="204" y="114" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">9@1</text>
<rect x="244" y="94" width="68" height="30" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="278" y="114" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">4@2</text>
<rect x="318" y="94" width="68" height="30" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="352" y="114" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">1@3</text>
<text x="420" y="114" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">max 9</text>
<text x="20" y="158" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">window 2..4</text>
<rect x="170" y="138" width="68" height="30" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="204" y="158" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">6@4</text>
<text x="420" y="158" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">max 6</text>
<text x="20" y="202" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">window 3..5</text>
<rect x="170" y="182" width="68" height="30" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="204" y="202" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">6@4</text>
<rect x="244" y="182" width="68" height="30" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="278" y="202" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">3@5</text>
<text x="420" y="202" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">max 6</text>
<text x="20" y="244" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">The front is the maximum. The 6 removes 1 and 4 from the back: smaller,</text>
<text x="20" y="266" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">and they leave the window earlier. 9@1 is before position 2, so it goes.</text>
</svg>
