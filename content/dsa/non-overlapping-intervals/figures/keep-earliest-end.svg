<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img">
<title>Non-overlapping Intervals, Example 1: the requests sorted by end, with the ones kept and the ones cancelled</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="20">request, by end</text><text x="420" y="20">decision</text>
</g>

<rect x="14" y="34" width="52" height="20" rx="4" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="20" y="48" fill="#ffffff">[1,4)</text>
<text x="20" y="78">[4,7)</text>
<text x="20" y="108">[3,8)</text>
<text x="20" y="138">[12,13)</text>
<text x="20" y="168">[9,15)</text>
<text x="20" y="198">[14,20)</text>
</g>

<g fill="#83748f" fill-opacity="0.35" stroke="#83748f" stroke-width="1.5">
<rect x="115" y="35" width="45" height="18"/>
<rect x="160" y="65" width="45" height="18"/>
<rect x="280" y="125" width="15" height="18"/>
<rect x="310" y="185" width="90" height="18"/>
</g>
<g fill="none" stroke="#83748f" stroke-width="1.5" stroke-dasharray="4 3">
<rect x="145" y="95" width="75" height="18"/>
<rect x="235" y="155" width="90" height="18"/>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="420" y="48">ends first: keep, free from 4</text>
<text x="420" y="78">starts at 4: keep, free from 7</text>
<text x="420" y="108">starts at 3, before 7: cancel</text>
<text x="420" y="138">keep, free from 13</text>
<text x="420" y="168">starts at 9, before 13: cancel</text>
<text x="420" y="198">keep, free from 20</text>
</g>

<path d="M 100 218 L 400 218" stroke="#83748f" stroke-width="1" fill="none"/>
<g stroke="#83748f" stroke-width="1">
<path d="M 100 214 L 100 222"/><path d="M 175 214 L 175 222"/><path d="M 250 214 L 250 222"/><path d="M 325 214 L 325 222"/><path d="M 400 214 L 400 222"/>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">
<text x="100" y="236">0</text><text x="175" y="236">5</text><text x="250" y="236">10</text><text x="325" y="236">15</text><text x="400" y="236">20</text>
</g>

<text x="20" y="256" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">Kept requests are filled and cancelled ones dashed: two cancelled, four kept.</text>
</svg>
