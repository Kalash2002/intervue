<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img">
<title>nums = [3,5,4,1,2,4] read as links i to nums[i]: tail 0, 3, 1, 5 into the loop 4, 2; 4 has two incoming links</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#83748f"/></marker></defs>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="20" y="30">nums = [3,5,4,1,2,4]; index i links to nums[i]</text>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="160">tail: nothing links to 0</text>
<text x="470" y="196">loop: 4, 2</text>
<text x="320" y="196">entrance = duplicate</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="20" y="96" width="44" height="30"/><rect x="110" y="96" width="44" height="30"/>
<rect x="200" y="96" width="44" height="30"/><rect x="290" y="96" width="44" height="30"/>
<rect x="500" y="96" width="44" height="30"/>
</g>
<rect x="390" y="96" width="44" height="30" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M 64 111 L 106 111"/><path d="M 154 111 L 196 111"/>
<path d="M 244 111 L 286 111"/><path d="M 334 111 L 386 111"/>
<path d="M 434 104 C 456 70, 478 70, 500 102"/>
<path d="M 500 120 C 478 152, 456 152, 436 122"/>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="42" y="116">0</text><text x="132" y="116">3</text><text x="222" y="116">1</text>
<text x="312" y="116">5</text><text x="412" y="116" fill="#ffffff">4</text><text x="522" y="116">2</text>
</g>
</svg>
