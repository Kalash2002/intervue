<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img">
<title>Merge Intervals, Example 1: sorted by start, 2 to 5 and 4 to 8 merge into 2 to 8</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">ranges sorted by start, then merged into one open range at a time</text>
<text x="10" y="62" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">1st</text>
<rect x="100" y="46" width="72" height="22" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="100" y="40" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">2 to 5</text>
<text x="10" y="106" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">2nd</text>
<rect x="148" y="90" width="96" height="22" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="148" y="84" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">4 to 8</text>
<text x="10" y="150" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">3rd</text>
<rect x="388" y="134" width="72" height="22" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="388" y="128" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">14 to 17</text>
<text x="10" y="212" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">merged</text>
<rect x="100" y="196" width="144" height="22" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="172" y="212" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">2 to 8</text>
<rect x="388" y="196" width="72" height="22" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="388" y="190" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">14 to 17</text>
<path d="M 60 244 L 600 244" stroke="#83748f" stroke-width="1.5" fill="none"/>
<circle cx="100" cy="244" r="4" fill="#7c3aed"/>
<text x="100" y="266" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">2</text>
<circle cx="148" cy="244" r="4" fill="#7c3aed"/>
<text x="148" y="266" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">4</text>
<circle cx="172" cy="244" r="4" fill="#7c3aed"/>
<text x="172" y="266" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">5</text>
<circle cx="244" cy="244" r="4" fill="#7c3aed"/>
<text x="244" y="266" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">8</text>
<circle cx="388" cy="244" r="4" fill="#7c3aed"/>
<text x="388" y="266" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">14</text>
<circle cx="460" cy="244" r="4" fill="#7c3aed"/>
<text x="460" y="266" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">17</text>
<text x="20" y="282" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">4 starts before the open range 2 to 5 ends, so the end grows to 8.</text>
<text x="20" y="304" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">14 starts after 8, so it opens a new range.</text>
</svg>
