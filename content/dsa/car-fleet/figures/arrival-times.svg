<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 264" width="640" height="264" role="img">
<title>Car Fleet, gate 20: time each car needs to reach the gate, nearest first; two groups, led by the cars at 13 and 9</title>
<text x="20" y="26" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">gate = 20; cars from the gate backwards; bar length is the time alone</text>
<text x="20" y="67" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">car at 13, speed 4</text>
<rect x="190" y="48" width="52" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="250" y="67" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">1.75   new group</text>
<text x="20" y="103" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">car at 9, speed 1</text>
<rect x="190" y="84" width="330" height="26" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="528" y="103" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">11   new group</text>
<text x="20" y="139" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">car at 6, speed 2</text>
<rect x="190" y="120" width="210" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="408" y="139" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">7   joins the group ahead</text>
<text x="20" y="175" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">car at 2, speed 3</text>
<rect x="190" y="156" width="180" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="378" y="175" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">6   joins the group ahead</text>
<path d="M 186 196 L 524 196" stroke="#83748f" stroke-width="1.5" fill="none"/>
<text x="190" y="216" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">0</text>
<text x="520" y="216" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">11</text>
<text x="20" y="244" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">A car that needs no more time than the group ahead cannot pass it, so it joins.</text>
</svg>
