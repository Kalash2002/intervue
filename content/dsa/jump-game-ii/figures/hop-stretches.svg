<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img">
<title>Jump Game II, Example 1: the stretch of stations reached with each number of hops</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#83748f"/></marker></defs>

<g stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M 80 102 Q 110 62 138 100"/>
<path d="M 140 102 Q 320 -22 498 100"/>
<path d="M 500 102 Q 530 62 558 100"/>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="58" y="104" width="44" height="28"/><rect x="118" y="104" width="44" height="28"/><rect x="178" y="104" width="44" height="28"/><rect x="238" y="104" width="44" height="28"/><rect x="298" y="104" width="44" height="28"/><rect x="358" y="104" width="44" height="28"/><rect x="418" y="104" width="44" height="28"/><rect x="478" y="104" width="44" height="28"/>
</g>
<rect x="538" y="104" width="44" height="28" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="80" y="123">3</text><text x="140" y="123">6</text><text x="200" y="123">0</text><text x="260" y="123">1</text><text x="320" y="123">3</text><text x="380" y="123">0</text><text x="440" y="123">0</text><text x="500" y="123">1</text>
<text x="560" y="123" fill="#ffffff">0</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="590" y="123">range</text>
<text x="590" y="150">station</text>
<text x="590" y="178">hops</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">
<text x="80" y="150">0</text><text x="140" y="150">1</text><text x="200" y="150">2</text><text x="260" y="150">3</text><text x="320" y="150">4</text><text x="380" y="150">5</text><text x="440" y="150">6</text><text x="500" y="150">7</text><text x="560" y="150">8</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="80" y="178">0</text><text x="140" y="178">1</text><text x="200" y="178">1</text><text x="260" y="178">1</text><text x="320" y="178">2</text><text x="380" y="178">2</text><text x="440" y="178">2</text><text x="500" y="178">2</text><text x="560" y="178">3</text>
</g>

<g stroke="#83748f" stroke-width="1.5" fill="none">
<path d="M 60 188 L 60 194 L 100 194 L 100 188"/>
<path d="M 120 188 L 120 194 L 280 194 L 280 188"/>
<path d="M 300 188 L 300 194 L 520 194 L 520 188"/>
<path d="M 540 188 L 540 194 L 580 194 L 580 188"/>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="middle">
<text x="80" y="212">start</text>
<text x="200" y="212">farthest 1 + 6 = 7</text>
<text x="410" y="212">farthest 7 + 1 = 8</text>
<text x="560" y="212">end</text>
</g>

<text x="20" y="238" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">Each stretch ends at the farthest reach of the stretch before it: 3, then 7, then 8.</text>
<text x="20" y="256" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">The arcs are the route 0, 1, 7, 8, through the station that set each farthest reach.</text>
</svg>
