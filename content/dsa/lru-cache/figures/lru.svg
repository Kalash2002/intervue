<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img">
<title>Capacity 2 after get(5): the map points at entries 5 and 8; 8, next to the tail sentinel, is evicted when 3 arrives</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#83748f"/></marker></defs>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="40">map</text>
<text x="195" y="214">most recent</text>
<text x="300" y="214">least recent: evicted by put(3, 30)</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="70" y="20" width="200" height="34"/>
<line x1="170" y1="20" x2="170" y2="54"/>
<rect x="30" y="140" width="80" height="34" stroke-dasharray="4 3"/>
<rect x="190" y="140" width="80" height="34"/>
<rect x="510" y="140" width="80" height="34" stroke-dasharray="4 3"/>
</g>
<rect x="350" y="140" width="80" height="34" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M 120 54 L 222 136"/>
<path d="M 220 54 L 382 136"/>
<path d="M 110 151 L 186 151"/><path d="M 190 163 L 114 163"/>
<path d="M 270 151 L 346 151"/><path d="M 350 163 L 274 163"/>
<path d="M 430 151 L 506 151"/><path d="M 510 163 L 434 163"/>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="120" y="42">5</text><text x="220" y="42">8</text>
<text x="70" y="162">head</text><text x="230" y="162">5:50</text>
<text x="390" y="162" fill="#ffffff">8:80</text><text x="550" y="162">tail</text>
</g>
</svg>
