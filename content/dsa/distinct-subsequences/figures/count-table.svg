<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" width="640" height="372" role="img">
<title>Distinct Subsequences, Example 1: the ways to spell each beginning of toes from the letters of tomatoes read so far</title>
<text x="20" y="22" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">text = tomatoes down the side, one row per letter read; word = toes along the top</text>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle"><text x="264" y="56">t</text><text x="308" y="56">o</text><text x="352" y="56">e</text><text x="396" y="56">s</text><text x="186" y="111">t</text><text x="186" y="139">o</text><text x="186" y="167">m</text><text x="186" y="195">a</text><text x="186" y="223">t</text><text x="186" y="251">o</text><text x="186" y="279">e</text><text x="186" y="307">s</text></g>
<text x="192" y="83" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="11" fill="#83748f" text-anchor="end">start</text>
<g fill="none" stroke="#83748f" stroke-width="1"><rect x="200" y="66" width="40" height="24"/><rect x="244" y="66" width="40" height="24"/><rect x="288" y="66" width="40" height="24"/><rect x="332" y="66" width="40" height="24"/><rect x="376" y="66" width="40" height="24"/><rect x="200" y="94" width="40" height="24"/><rect x="288" y="94" width="40" height="24"/><rect x="332" y="94" width="40" height="24"/><rect x="376" y="94" width="40" height="24"/><rect x="200" y="122" width="40" height="24"/><rect x="244" y="122" width="40" height="24"/><rect x="332" y="122" width="40" height="24"/><rect x="376" y="122" width="40" height="24"/><rect x="200" y="150" width="40" height="24"/><rect x="244" y="150" width="40" height="24"/><rect x="288" y="150" width="40" height="24"/><rect x="332" y="150" width="40" height="24"/><rect x="376" y="150" width="40" height="24"/><rect x="200" y="178" width="40" height="24"/><rect x="244" y="178" width="40" height="24"/><rect x="288" y="178" width="40" height="24"/><rect x="332" y="178" width="40" height="24"/><rect x="376" y="178" width="40" height="24"/><rect x="200" y="206" width="40" height="24"/><rect x="288" y="206" width="40" height="24"/><rect x="332" y="206" width="40" height="24"/><rect x="376" y="206" width="40" height="24"/><rect x="200" y="234" width="40" height="24"/><rect x="244" y="234" width="40" height="24"/><rect x="332" y="234" width="40" height="24"/><rect x="376" y="234" width="40" height="24"/><rect x="200" y="262" width="40" height="24"/><rect x="244" y="262" width="40" height="24"/><rect x="288" y="262" width="40" height="24"/><rect x="376" y="262" width="40" height="24"/><rect x="200" y="290" width="40" height="24"/><rect x="244" y="290" width="40" height="24"/><rect x="288" y="290" width="40" height="24"/><rect x="332" y="290" width="40" height="24"/></g>
<g fill="none" stroke="#83748f" stroke-width="2.5"><rect x="244" y="94" width="40" height="24"/><rect x="288" y="122" width="40" height="24"/><rect x="244" y="206" width="40" height="24"/><rect x="288" y="234" width="40" height="24"/><rect x="332" y="262" width="40" height="24"/></g>
<rect x="376" y="290" width="40" height="24" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle"><text x="220" y="83">1</text><text x="264" y="83">0</text><text x="308" y="83">0</text><text x="352" y="83">0</text><text x="396" y="83">0</text><text x="220" y="111">1</text><text x="264" y="111">1</text><text x="308" y="111">0</text><text x="352" y="111">0</text><text x="396" y="111">0</text><text x="220" y="139">1</text><text x="264" y="139">1</text><text x="308" y="139">1</text><text x="352" y="139">0</text><text x="396" y="139">0</text><text x="220" y="167">1</text><text x="264" y="167">1</text><text x="308" y="167">1</text><text x="352" y="167">0</text><text x="396" y="167">0</text><text x="220" y="195">1</text><text x="264" y="195">1</text><text x="308" y="195">1</text><text x="352" y="195">0</text><text x="396" y="195">0</text><text x="220" y="223">1</text><text x="264" y="223">2</text><text x="308" y="223">1</text><text x="352" y="223">0</text><text x="396" y="223">0</text><text x="220" y="251">1</text><text x="264" y="251">2</text><text x="308" y="251">3</text><text x="352" y="251">0</text><text x="396" y="251">0</text><text x="220" y="279">1</text><text x="264" y="279">2</text><text x="308" y="279">3</text><text x="352" y="279">3</text><text x="396" y="279">0</text><text x="220" y="307">1</text><text x="264" y="307">2</text><text x="308" y="307">3</text><text x="352" y="307">3</text><text x="396" y="307" fill="#ffffff">3</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="440" y="83">column j: the ways to spell the</text><text x="440" y="101">first j letters of toes so far</text><text x="440" y="131">thick: the letter read matches</text><text x="440" y="149">column j, so the count from</text><text x="440" y="167">column j − 1 above is added</text><text x="440" y="197">second t: 2 ways to spell t</text><text x="440" y="215">second o: 1 + 2 = 3 ways for to</text><text x="440" y="245">m and a match nothing:</text><text x="440" y="263">their rows repeat the row above</text></g>
<text x="20" y="344" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">The e and the s carry the 3 into the last column; the highlighted cell, where the s matches, is the answer.</text>
<text x="20" y="362" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">One array holds a row; running j downwards keeps the row above in column j − 1.</text>
</svg>
