<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img">
<title>Contains Duplicate II on 4, 9, 4 with gap 2: the map of last positions after each step</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">step</text>
<text x="110" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">look up</text>
<text x="200" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">result</text>
<text x="420" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">map after step (code : pos)</text>
<text x="20" y="62" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">j=0  4</text>
<text x="110" y="62" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">4 ?</text>
<text x="200" y="62" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">miss, store</text>
<rect x="420" y="44" width="72" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="456" y="62" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">4 : 0</text>
<text x="20" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">j=1  9</text>
<text x="110" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">9 ?</text>
<text x="200" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">miss, store</text>
<rect x="420" y="88" width="72" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="456" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">4 : 0</text>
<rect x="500" y="88" width="72" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="536" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">9 : 1</text>
<text x="20" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">j=2  4</text>
<text x="110" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">4 ?</text>
<text x="200" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">hit at 0: 2 - 0 = 2 &lt;= 2</text>
<rect x="420" y="132" width="72" height="26" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="456" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">4 : 0</text>
<rect x="500" y="132" width="72" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="536" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">9 : 1</text>
<text x="20" y="212" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">The 4 at position 2 finds the 4 at position 0: 2 places back, within 2.</text>
</svg>
