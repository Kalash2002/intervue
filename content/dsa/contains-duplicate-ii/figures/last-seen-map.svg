<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img">
<title>Contains Duplicate II on 4, 9, 4 with gap 2: the window set after each step</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">step</text>
<text x="110" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">drop</text>
<text x="200" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">add</text>
<text x="420" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">window set after step</text>
<text x="20" y="62" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">j=0  4</text><text x="110" y="62" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">nothing</text><text x="200" y="62" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">4 enters</text>
<rect x="420" y="44" width="72" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="456" y="62" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">4</text>
<text x="20" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">j=1  9</text><text x="110" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">nothing</text><text x="200" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">9 enters</text>
<rect x="420" y="88" width="72" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="456" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">4</text>
<rect x="500" y="88" width="72" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="536" y="106" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">9</text>
<text x="20" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">j=2  4</text><text x="110" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">nothing yet</text><text x="200" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">4 already in: repeat</text>
<rect x="420" y="132" width="72" height="26" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="456" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">4</text>
<rect x="500" y="132" width="72" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="536" y="150" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">9</text>
<text x="20" y="212" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">The 4 at position 2 cannot enter: a 4 is still within the last 2 positions.</text>
</svg>
