<text x="420" y="50" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">at 40: 15 and 25 both smaller,</text>
<text x="420" y="68" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">so go left</text>
<text x="420" y="110" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">at 20: 15 smaller, 25 larger,</text>
