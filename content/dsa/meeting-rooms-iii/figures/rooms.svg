<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img">
<title>Meeting Rooms III on two rooms with bookings 0-5, 1-3 and 2-4: the third booking waits for room 1 and runs from 3 to 5</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="63">room 0</text><text x="20" y="113">room 1</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="90" y="42" width="300" height="30"/>
<rect x="150" y="92" width="120" height="30"/>
</g>
<rect x="270" y="92" width="120" height="30" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="240" y="62">[0,5)</text>
<text x="210" y="112">[1,3)</text>
<text x="330" y="112" fill="#ffffff">[3,5)</text>
</g>

<g stroke="#83748f" stroke-width="1.5" fill="none">
<path d="M 90 140 L 390 140"/>
<path d="M 90 140 L 90 146"/><path d="M 150 140 L 150 146"/><path d="M 210 140 L 210 146"/><path d="M 270 140 L 270 146"/><path d="M 330 140 L 330 146"/><path d="M 390 140 L 390 146"/>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">
<text x="90" y="164">0</text><text x="150" y="164">1</text><text x="210" y="164">2</text><text x="270" y="164">3</text><text x="330" y="164">4</text><text x="390" y="164">5</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="196">1. [0,5): both rooms free, so the lowest, room 0, takes it.</text>
<text x="20" y="216">2. [1,3): room 0 is busy, so room 1 takes it.</text>
<text x="20" y="236">3. [2,4): both busy. Room 1 frees first, at 3, so it runs [3,5) there.</text>
<text x="20" y="260">Room 1 hosted 2 sessions and room 0 one, so the answer is 1.</text>
</g>
</svg>
