<text x="20" y="268" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">The half, 11, is first reached with the 8, as 3 + 8. At the end only 2 cannot be made.</text>
<text x="20" y="288" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">Each item adds its weight to the totals reached before it, from the top down.</text>
