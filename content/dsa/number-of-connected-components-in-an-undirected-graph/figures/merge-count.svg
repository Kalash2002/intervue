<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">
<title>Connected components, Example 1: six machines and three cables leave three networks</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">n = 6; cables 0-4, 4-2 and 1-5</text>
<rect x="50" y="62" width="260" height="76" rx="10" fill="none" stroke="#83748f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="370" y="62" width="160" height="76" rx="10" fill="none" stroke="#83748f" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="552" y="62" width="66" height="76" rx="10" fill="none" stroke="#83748f" stroke-width="1" stroke-dasharray="4 4"/>
<path d="M 100 100 L 160 100" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 200 100 L 260 100" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 420 100 L 480 100" stroke="#83748f" stroke-width="1.5" fill="none"/>
<circle cx="80" cy="100" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="80" y="105" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">0</text>
<circle cx="180" cy="100" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="180" y="105" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">4</text>
<circle cx="280" cy="100" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="280" y="105" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">2</text>
<circle cx="400" cy="100" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="400" y="105" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">1</text>
<circle cx="500" cy="100" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="500" y="105" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">5</text>
<circle cx="585" cy="100" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="585" y="105" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">3</text>
<text x="585" y="158" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="middle">no cable</text>
<text x="20" y="196" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">count: 6, then 5 (0-4), then 4 (4-2), then 3 (1-5)</text>
<rect x="478" y="180" width="140" height="26" rx="4" fill="#7c3aed"/>
<text x="548" y="197" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">3 networks</text>
<text x="20" y="232" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">Each cable that joins two different groups lowers the count by one.</text>
</svg>
