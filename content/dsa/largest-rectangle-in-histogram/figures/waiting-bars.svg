<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img">
<title>Largest Rectangle in Histogram on [3, 1, 3, 2, 2]: the bars, the winning 3 by 2 block, and every pop of the stack</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="24">bars; purple is the largest block</text>
<text x="300" y="24">stack pops, in order (the end acts as a bar of height 0)</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="20" y="60" width="44" height="90"/>
<rect x="68" y="120" width="44" height="30"/>
<rect x="116" y="60" width="44" height="90"/>
<rect x="164" y="90" width="44" height="60"/>
<rect x="212" y="90" width="44" height="60"/>
</g>
<rect x="116" y="90" width="140" height="60" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<path d="M 14 150 L 262 150" stroke="#83748f" stroke-width="1.5" fill="none"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="42" y="172">3</text><text x="90" y="172">1</text><text x="138" y="172">3</text><text x="186" y="172">2</text><text x="234" y="172">2</text>
<text x="42" y="192" font-size="12">0</text><text x="90" y="192" font-size="12">1</text><text x="138" y="192" font-size="12">2</text><text x="186" y="192" font-size="12">3</text><text x="234" y="192" font-size="12">4</text>
<text x="186" y="125" fill="#ffffff" font-size="13">3 x 2 = 6</text>
</g>

<rect x="296" y="124" width="236" height="24" fill="#7c3aed"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" xml:space="preserve">
<text x="300" y="56">at bar 1: pop bar 0   1 wide x 3 = 3</text>
<text x="300" y="84">at bar 3: pop bar 2   1 wide x 3 = 3</text>
<text x="300" y="112">at end:   pop bar 4   1 wide x 2 = 2</text>
<text x="300" y="140" fill="#ffffff">at end:   pop bar 3   3 wide x 2 = 6</text>
<text x="300" y="168">at end:   pop bar 1   5 wide x 1 = 5</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="226">When bar 3 is popped at the end, the bar below it on the stack is bar 1,</text>
<text x="20" y="246">so the block spans positions 2 to 4: 3 wide at height 2, area 6.</text>
</g>
</svg>
