<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img">
<title>Set Matrix Zeroes, Example 1: the grid after the marking pass, with row 0 and column 0 holding the flags, and the grid after clearing</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#83748f"/></marker></defs>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="40" y="28">after the marking pass</text>
<text x="400" y="28">after the clearing pass</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="40" y="40" width="220" height="120"/>
<rect x="400" y="40" width="220" height="120"/>
</g>
<g fill="none" stroke="#83748f" stroke-width="0.75">
<path d="M 84 40 L 84 160 M 128 40 L 128 160 M 172 40 L 172 160 M 216 40 L 216 160"/>
<path d="M 40 70 L 260 70 M 40 100 L 260 100 M 40 130 L 260 130"/>
<path d="M 444 40 L 444 160 M 488 40 L 488 160 M 532 40 L 532 160 M 576 40 L 576 160"/>
<path d="M 400 70 L 620 70 M 400 100 L 620 100 M 400 130 L 620 130"/>
</g>
<g fill="none" stroke="#83748f" stroke-width="1.5" stroke-dasharray="4 3">
<rect x="44" y="44" width="212" height="22"/>
<rect x="44" y="44" width="36" height="112"/>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="62" y="60">7</text><text x="106" y="60">0</text><text x="150" y="60">5</text><text x="194" y="60">0</text><text x="238" y="60">3</text>
<text x="62" y="90">0</text><text x="106" y="90" font-weight="bold">0</text><text x="150" y="90">8</text><text x="194" y="90">6</text><text x="238" y="90">11</text>
<text x="62" y="120">0</text><text x="106" y="120">14</text><text x="150" y="120">10</text><text x="194" y="120" font-weight="bold">0</text><text x="238" y="120">1</text>
<text x="62" y="150">13</text><text x="106" y="150">6</text><text x="150" y="150">15</text><text x="194" y="150">8</text><text x="238" y="150">5</text>

<text x="422" y="60">7</text><text x="466" y="60">0</text><text x="510" y="60">5</text><text x="554" y="60">0</text><text x="598" y="60">3</text>
<text x="422" y="90">0</text><text x="466" y="90">0</text><text x="510" y="90">0</text><text x="554" y="90">0</text><text x="598" y="90">0</text>
<text x="422" y="120">0</text><text x="466" y="120">0</text><text x="510" y="120">0</text><text x="554" y="120">0</text><text x="598" y="120">0</text>
<text x="422" y="150">13</text><text x="466" y="150">0</text><text x="510" y="150">15</text><text x="554" y="150">0</text><text x="598" y="150">5</text>
</g>

<rect x="40" y="172" width="220" height="26" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="150" y="190" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">column 0 has a 0: false</text>

<path d="M 274 100 L 386 100" stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<text x="330" y="90" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="middle">bottom row up</text>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="226">Bold: the failed sensors. Dashed: row 0 and column 0, which hold the flags: the 0s at</text>
<text x="20" y="244">row 0, columns 1 and 3, flag those columns; the 0s at column 0, rows 1 and 2, flag those</text>
<text x="20" y="262">rows. The corner cannot hold two flags, so column 0 has its own boolean, in purple.</text>
</g>
</svg>
