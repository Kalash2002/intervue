<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img">
<title>Min Cost to Connect All Points, Example 1: Prim grows the network from 0,0 for a total of 14</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">points [0,0], [3,1], [1,4], [5,5]; cable length = |dx| + |dy|</text>
<path d="M 80 230 L 260 194" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 80 230 L 140 86" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 140 86 L 380 50" stroke="#7c3aed" stroke-width="3" fill="none"/>
<circle cx="80" cy="230" r="7" fill="#83748f"/>
<circle cx="260" cy="194" r="7" fill="#83748f"/>
<circle cx="140" cy="86" r="7" fill="#83748f"/>
<circle cx="380" cy="50" r="7" fill="#7c3aed"/>
<text x="80" y="256" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">[0,0] start</text>
<text x="260" y="220" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">[3,1]</text>
<text x="120" y="80" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="end">[1,4]</text>
<text x="380" y="76" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">[5,5]</text>
<text x="176" y="230" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">4</text>
<text x="96" y="156" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="end">5</text>
<text x="260" y="58" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#7c3aed" text-anchor="middle">5</text>
<text x="404" y="88" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">best cable into the network:</text>
<text x="404" y="110"font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">[3,1] 4, [1,4] 5, [5,5] 10</text>
<text x="404" y="134" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">take [3,1]; [5,5] drops to 6</text>
<text x="404" y="158" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">take [1,4]; [5,5] drops to 5</text>
<text x="404" y="182" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">take [5,5] for 5</text>
<rect x="396" y="196" width="200" height="26" rx="4" fill="#7c3aed"/>
<text x="496" y="213" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">total 4 + 5 + 5 = 14</text>
</svg>
