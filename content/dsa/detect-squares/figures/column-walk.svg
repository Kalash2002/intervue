<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">
<title>Detect Squares, Example 1: count(6, 3) walks the stored points of column 6 and finds one square of side 4 on each side</title>

<g fill="none" stroke="#83748f" stroke-width="1.5" stroke-dasharray="5 4">
<rect x="90" y="40" width="100" height="100"/>
<rect x="190" y="40" width="100" height="100"/>
</g>

<g fill="#83748f">
<circle cx="90" cy="40" r="5"/>
<circle cx="190" cy="40" r="5"/>
<circle cx="290" cy="40" r="5"/>
<circle cx="90" cy="140" r="5"/>
<circle cx="290" cy="140" r="5"/>
</g>
<circle cx="190" cy="140" r="9" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="190" y="144" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#ffffff" text-anchor="middle">q</text>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="90" y="26">(2, 7)</text><text x="190" y="26">(6, 7)</text><text x="290" y="26">(10, 7)</text>
<text x="90" y="166">(2, 3)</text><text x="190" y="168">(6, 3)</text><text x="290" y="166">(10, 3)</text>
<text x="140" y="95">left</text><text x="240" y="95">right</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="340" y="44">count(6, 3) walks column 6:</text>
<text x="340" y="66">(6, 7) is there, side 7 - 3 = 4</text>
<text x="340" y="96">right, column 6 + 4 = 10:</text>
<text x="340" y="116">(10, 3), (10, 7): 1 x 1 = 1</text>
<text x="340" y="146">left, column 6 - 4 = 2:</text>
<text x="340" y="166">(2, 3), (2, 7): 1 x 1 = 1</text>
<text x="340" y="196">copies of (6, 7): 1</text>
<text x="340" y="216">count = 1 x (1 + 1) = 2</text>
</g>

<text x="20" y="240" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">The query q is never stored; column 6 is the side both squares share.</text>
</svg>
