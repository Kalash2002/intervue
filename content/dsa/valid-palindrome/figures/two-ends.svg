<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img">
<title>Valid Palindrome on "Mo, 12 a 21 oM!": ignored characters faded, matched pairs joined, the two positions meeting at the a</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f"><text x="20" y="24">characters that count are boxed; the rest are skipped</text></g>
<g fill="none" stroke="#83748f" stroke-width="1.5"><rect x="20" y="40" width="38" height="34"/><rect x="60" y="40" width="38" height="34"/><rect x="100" y="40" width="38" height="34" stroke-dasharray="3 3" opacity="0.5"/><rect x="140" y="40" width="38" height="34" stroke-dasharray="3 3" opacity="0.5"/><rect x="180" y="40" width="38" height="34"/><rect x="220" y="40" width="38" height="34"/><rect x="260" y="40" width="38" height="34" stroke-dasharray="3 3" opacity="0.5"/><rect x="340" y="40" width="38" height="34" stroke-dasharray="3 3" opacity="0.5"/><rect x="380" y="40" width="38" height="34"/><rect x="420" y="40" width="38" height="34"/><rect x="460" y="40" width="38" height="34" stroke-dasharray="3 3" opacity="0.5"/><rect x="500" y="40" width="38" height="34"/><rect x="540" y="40" width="38" height="34"/><rect x="580" y="40" width="38" height="34" stroke-dasharray="3 3" opacity="0.5"/></g>
<rect x="300" y="40" width="38" height="34" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#83748f" text-anchor="middle"><text x="39.0" y="62">M</text><text x="79.0" y="62">o</text><text x="119.0" y="62" opacity="0.5">,</text><text x="159.0" y="62" opacity="0.5">&#160;</text><text x="199.0" y="62">1</text><text x="239.0" y="62">2</text><text x="279.0" y="62" opacity="0.5">&#160;</text><text x="319.0" y="62" fill="#ffffff">a</text><text x="359.0" y="62" opacity="0.5">&#160;</text><text x="399.0" y="62">2</text><text x="439.0" y="62">1</text><text x="479.0" y="62" opacity="0.5">&#160;</text><text x="519.0" y="62">o</text><text x="559.0" y="62">M</text><text x="599.0" y="62" opacity="0.5">!</text></g>
<g fill="none" stroke="#83748f" stroke-width="1.5"><path d="M 39.0 78 Q 299.0 146.6 559.0 78"/><path d="M 79.0 78 Q 299.0 138.2 519.0 78"/><path d="M 199.0 78 Q 319.0 117.2 439.0 78"/><path d="M 239.0 78 Q 319.0 108.8 399.0 78"/></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f"><text x="20" y="190">Pairs M-M, o-o, 1-1 and 2-2 match once case is ignored.</text><text x="20" y="212">The positions meet on the a: every pair matched, so the answer is true.</text></g>
</svg>
