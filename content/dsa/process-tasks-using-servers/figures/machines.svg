<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" width="640" height="316" role="img">
<title>Process Tasks Using Servers on weights 4, 2 and 7 with durations 3, 3, 3, 1 and 1: each machine's jobs on a time axis</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="63">machine 0, weight 4</text><text x="20" y="113">machine 1, weight 2</text><text x="20" y="163">machine 2, weight 7</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="240" y="42" width="150" height="30"/>
<rect x="190" y="92" width="150" height="30"/><rect x="340" y="92" width="50" height="30"/>
<rect x="290" y="142" width="150" height="30"/>
</g>
<rect x="390" y="92" width="50" height="30" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="315" y="62">job 1</text>
<text x="265" y="112">job 0</text><text x="365" y="112">j3</text><text x="415" y="112" fill="#ffffff">j4</text>
<text x="365" y="162">job 2</text>
</g>

<g stroke="#83748f" stroke-width="1.5" fill="none">
<path d="M 190 190 L 440 190"/>
<path d="M 190 190 L 190 196"/><path d="M 240 190 L 240 196"/><path d="M 290 190 L 290 196"/><path d="M 340 190 L 340 196"/><path d="M 390 190 L 390 196"/><path d="M 440 190 L 440 196"/>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">
<text x="190" y="214">0</text><text x="240" y="214">1</text><text x="290" y="214">2</text><text x="340" y="214">3</text><text x="390" y="214">4</text><text x="440" y="214">5</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="246">Jobs 0, 1, 2 arrive at 0, 1, 2 and take machines 1, 0, 2 by weight.</text>
<text x="20" y="266">At second 3 only machine 1 is free, so it takes job 3.</text>
<text x="20" y="286">At second 4 machines 0 and 1 are free; the lighter, machine 1, takes job 4.</text>
</g>
</svg>
