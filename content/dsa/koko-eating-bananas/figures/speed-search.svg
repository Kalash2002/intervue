<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="20" y="134">1..15</text><text x="80" y="134">speed 8: 1+2+1+2 = 6 hours, fits</text><text x="520" y="134">high = 8</text>
<text x="20" y="156">1..8</text><text x="80" y="156">speed 4: 2+4+1+3 = 10 hours, too many</text><text x="520" y="156">low = 5</text>
<text x="20" y="178">5..8</text><text x="80" y="178">speed 6: 2+3+1+2 = 8 hours, fits</text><text x="520" y="178">high = 6</text>
