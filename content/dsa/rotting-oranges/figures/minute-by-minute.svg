<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
<title>Rotting Oranges on the 3 by 4 crate of Example 1: each orange is labelled with the minute it turns mouldy</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f"><text x="20" y="22">each orange shows the minute it turns; dashed slots are empty</text></g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="20" y="40" width="36" height="36"/>
<rect x="60" y="40" width="36" height="36"/>
<rect x="100" y="40" width="36" height="36" stroke-dasharray="2 4" opacity="0.4"/>
<rect x="20" y="80" width="36" height="36" stroke-dasharray="2 4" opacity="0.4"/>
<rect x="60" y="80" width="36" height="36"/>
<rect x="100" y="80" width="36" height="36"/>
<rect x="140" y="80" width="36" height="36"/>
<rect x="20" y="120" width="36" height="36"/>
<rect x="60" y="120" width="36" height="36"/>
<rect x="100" y="120" width="36" height="36" stroke-dasharray="2 4" opacity="0.4"/>
<rect x="140" y="120" width="36" height="36" stroke-dasharray="2 4" opacity="0.4"/>
</g>
<g fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5">
<rect x="140" y="40" width="36" height="36"/>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#83748f" text-anchor="middle">
<text x="158" y="63" fill="#ffffff">0</text>
<text x="38" y="63">5</text>
<text x="78" y="63">4</text>
<text x="78" y="103">3</text>
<text x="118" y="103">2</text>
<text x="158" y="103">1</text>
<text x="38" y="143">5</text>
<text x="78" y="143">4</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">
<text x="230" y="58">queue, one minute at a time:</text>
<text x="230" y="82">minute 0: (0,3)  the mouldy source</text>
<text x="230" y="106">minute 1: (1,3)</text>
<text x="230" y="130">minute 2: (1,2)</text>
<text x="230" y="154">minute 3: (1,1)</text>
<text x="230" y="178">minute 4: (0,1) (2,1)   minute 5: (0,0) (2,0)</text>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="214">All 7 fresh oranges turned, so the answer is the last minute: 5.</text>
</g>
</svg>
