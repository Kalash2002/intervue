<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img">
<title>Surrounded Regions, Example 1: the flood from the open border cells marks three cells safe, and the three unmarked open cells are filled</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f"><text x="20" y="22">the board during the final pass</text></g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="20" y="40" width="40" height="40"/><rect x="60" y="40" width="40" height="40"/><rect x="100" y="40" width="40" height="40"/><rect x="140" y="40" width="40" height="40"/><rect x="180" y="40" width="40" height="40"/>
<rect x="20" y="80" width="40" height="40"/><rect x="60" y="80" width="40" height="40"/><rect x="100" y="80" width="40" height="40"/><rect x="140" y="80" width="40" height="40"/><rect x="180" y="80" width="40" height="40"/>
<rect x="20" y="120" width="40" height="40"/><rect x="60" y="120" width="40" height="40"/><rect x="100" y="120" width="40" height="40"/><rect x="140" y="120" width="40" height="40"/><rect x="180" y="120" width="40" height="40"/>
<rect x="20" y="160" width="40" height="40"/><rect x="60" y="160" width="40" height="40"/><rect x="100" y="160" width="40" height="40"/><rect x="140" y="160" width="40" height="40"/><rect x="180" y="160" width="40" height="40"/>
</g>
<g fill="#7c3aed"><rect x="61" y="81" width="38" height="38"/><rect x="101" y="81" width="38" height="38"/><rect x="101" y="121" width="38" height="38"/></g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="16" fill="#83748f" text-anchor="middle">
<text x="40" y="66">X</text><text x="80" y="66">X</text><text x="120" y="66">X</text><text x="160" y="66">X</text><text x="200" y="66">X</text>
<text x="40" y="106">X</text><text x="80" y="106" fill="#ffffff">O</text><text x="120" y="106" fill="#ffffff">O</text><text x="160" y="106">X</text><text x="200" y="106">S</text>
<text x="40" y="146">X</text><text x="80" y="146">X</text><text x="120" y="146" fill="#ffffff">O</text><text x="160" y="146">X</text><text x="200" y="146">S</text>
<text x="40" y="186">X</text><text x="80" y="186">S</text><text x="120" y="186">X</text><text x="160" y="186">X</text><text x="200" y="186">X</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">
<text x="260" y="64">1. mark open border cells S:</text>
<text x="260" y="82">   (1,4), (2,4), (3,1)</text>
<text x="260" y="106">2. flood from them: no new cells</text>
<text x="260" y="130">3. final pass: S becomes O,</text>
<text x="260" y="148">   every remaining O becomes X</text>
<text x="260" y="172">filled: (1,1), (1,2), (2,2)</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="232">S: open and connected to the border, so safe. Purple: open cells</text>
<text x="20" y="252">the flood never reached, so they are surrounded and become X.</text>
</g>
</svg>
