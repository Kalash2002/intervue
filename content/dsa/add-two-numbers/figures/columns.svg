<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img">
<title>237 plus 95 column by column, lowest digit first: carries 1 and 1, result digits 2, 3, 3</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="84">carry in</text>
<text x="20" y="120">first</text>
<text x="20" y="156">second</text>
<text x="20" y="202">result</text>
<text x="144" y="44">ones</text><text x="246" y="44">tens</text><text x="330" y="44">hundreds</text>
<text x="400" y="156">second ran out: 0</text>
</g>

<line x1="120" y1="172" x2="390" y2="172" stroke="#83748f" stroke-width="1.5"/>
<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="138" y="182" width="44" height="30"/><rect x="338" y="182" width="44" height="30"/>
</g>
<rect x="238" y="182" width="44" height="30" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="160" y="84">0</text><text x="260" y="84">1</text><text x="360" y="84">1</text>
<text x="160" y="120">7</text><text x="260" y="120">3</text><text x="360" y="120">2</text>
<text x="160" y="156">5</text><text x="260" y="156">9</text><text x="360" y="156">-</text>
<text x="160" y="202">2</text><text x="260" y="202" fill="#ffffff">3</text><text x="360" y="202">3</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">
<text x="400" y="202">tens: 3+9+1 = 13, write 3</text>
</g>
</svg>
