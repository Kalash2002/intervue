<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f"><text x="20" y="200">MNMNN holds 3 Ns and 2 Ms: 5 - 3 = 2 changes, within k = 2.</text><text x="20" y="222">The last M would need 6 - 3 = 3, so the window slides and stays at 5.</text></g>
