<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
<title>Letter Combinations, Example 1: the choice tree for the digits 5 and 8, whose nine leaves are the nine strings</title>

<g stroke="#83748f" stroke-width="1.5" fill="none">
<path d="M 320 46 L 128 79"/>
<path d="M 320 46 L 320 79"/>
<path d="M 320 46 L 512 79"/>
<path d="M 128 101 L 64 134"/><path d="M 128 101 L 128 134"/><path d="M 128 101 L 192 134"/>
<path d="M 320 101 L 256 134"/><path d="M 320 101 L 320 134"/><path d="M 320 101 L 384 134"/>
<path d="M 512 101 L 448 134"/><path d="M 512 101 L 512 134"/><path d="M 512 101 L 576 134"/>
</g>
<rect x="300" y="136" width="40" height="22" rx="4" fill="#7c3aed"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="320" y="40">""</text>
<text x="128" y="95">j</text><text x="320" y="95">k</text><text x="512" y="95">l</text>
<text x="64" y="152">jt</text><text x="128" y="152">ju</text><text x="192" y="152">jv</text>
<text x="256" y="152">kt</text><text x="320" y="152" fill="#ffffff">ku</text><text x="384" y="152">kv</text>
<text x="448" y="152">lt</text><text x="512" y="152">lu</text><text x="576" y="152">lv</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="194">Row 1 picks a letter of 5 (jkl), row 2 a letter of 8 (tuv).</text>
<text x="20" y="216">Purple: k, then u. The 9 leaves are the 9 strings.</text>
</g>
</svg>
