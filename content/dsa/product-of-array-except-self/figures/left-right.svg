<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img">
<title>Product of Array Except Self on [2, 5, 3]: product to the left, product to the right, and their product</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="44">nums</text>
<text x="20" y="88">left (before the slot)</text>
<text x="20" y="132">right (after the slot)</text>
<text x="20" y="176">out = left * right</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="300" y="24" width="80" height="28"/><rect x="400" y="24" width="80" height="28"/><rect x="500" y="24" width="80" height="28"/>
<rect x="300" y="68" width="80" height="28"/><rect x="400" y="68" width="80" height="28"/><rect x="500" y="68" width="80" height="28"/>
<rect x="300" y="112" width="80" height="28"/><rect x="400" y="112" width="80" height="28"/><rect x="500" y="112" width="80" height="28"/>
<rect x="300" y="156" width="80" height="28"/><rect x="500" y="156" width="80" height="28"/>
</g>
<rect x="400" y="156" width="80" height="28" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="340" y="43">2</text><text x="440" y="43">5</text><text x="540" y="43">3</text>
<text x="340" y="87">1</text><text x="440" y="87">2</text><text x="540" y="87">10</text>
<text x="340" y="131">15</text><text x="440" y="131">3</text><text x="540" y="131">1</text>
<text x="340" y="175">15</text><text x="440" y="175" fill="#ffffff">6</text><text x="540" y="175">10</text>
</g>

<text x="20" y="214" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">Slot 1: 2 on the left times 3 on the right is 6. The 5 itself is never used.</text>
</svg>
