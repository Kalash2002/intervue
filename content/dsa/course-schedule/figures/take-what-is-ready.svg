<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350" role="img">
<title>Course Schedule on Example 1: each course shows how many prerequisites it waits for, and courses are taken as that count reaches zero</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#83748f"/>
</marker>
</defs>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f"><text x="20" y="22">an arrow b to a means b must be finished before a</text></g>

<g stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="100" y1="111" x2="200" y2="69"/>
<line x1="100" y1="129" x2="200" y2="171"/>
<line x1="240" y1="69" x2="340" y2="111"/>
<line x1="240" y1="171" x2="340" y2="129"/>
<line x1="382" y1="120" x2="478" y2="120"/>
</g>
<g stroke-width="1.5">
<circle cx="80" cy="120" r="22" fill="#7c3aed" stroke="#7c3aed"/>
<circle cx="220" cy="60" r="22" fill="none" stroke="#83748f"/>
<circle cx="220" cy="180" r="22" fill="none" stroke="#83748f"/>
<circle cx="360" cy="120" r="22" fill="none" stroke="#83748f"/>
<circle cx="500" cy="120" r="22" fill="none" stroke="#83748f"/>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#83748f" text-anchor="middle">
<text x="80" y="125" fill="#ffffff">4</text>
<text x="220" y="65">0</text>
<text x="220" y="185">3</text>
<text x="360" y="125">1</text>
<text x="500" y="125">2</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">
<text x="80" y="162">waits 0</text>
<text x="220" y="102">waits 1</text>
<text x="220" y="222">waits 1</text>
<text x="360" y="162">waits 2</text>
<text x="500" y="162">waits 1</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">
<text x="20" y="260">take 4: courses 0 and 3 free up</text>
<text x="330" y="260">take 0: course 1 waits 1</text>
<text x="20" y="282">take 3: course 1 frees up</text>
<text x="330" y="282">take 1: course 2 frees up</text>
<text x="20" y="304">take 2: all 5 courses taken</text>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="334">Every course was taken, so the answer is true.</text>
</g>
</svg>
