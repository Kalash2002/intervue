<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
<title>Longest Palindromic Substring, Example 1: the middle o of tqpopqm grows to qpopq</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">s = "tqpopqm": grow outward from the o at index 3 while both ends match</text>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="middle">
<text x="82" y="44">0</text><text x="126" y="44">1</text><text x="170" y="44">2</text><text x="214" y="44">3</text><text x="258" y="44">4</text><text x="302" y="44">5</text><text x="346" y="44">6</text>
</g>
<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="60" y="50" width="44" height="30"/><rect x="104" y="50" width="44" height="30"/><rect x="148" y="50" width="44" height="30"/><rect x="192" y="50" width="44" height="30"/><rect x="236" y="50" width="44" height="30"/><rect x="280" y="50" width="44" height="30"/><rect x="324" y="50" width="44" height="30"/>
<rect x="192" y="96" width="44" height="22"/>
<rect x="148" y="126" width="132" height="22"/>
</g>
<g fill="none" stroke="#83748f" stroke-width="1.5" stroke-dasharray="4 3">
<rect x="60" y="186" width="44" height="22"/><rect x="324" y="186" width="44" height="22"/>
</g>
<rect x="104" y="156" width="220" height="22" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="82" y="70">t</text><text x="126" y="70">q</text><text x="170" y="70">p</text><text x="214" y="70">o</text><text x="258" y="70">p</text><text x="302" y="70">q</text><text x="346" y="70">m</text>
<text x="214" y="112">o</text>
<text x="214" y="142">pop</text>
<text x="214" y="172" fill="#ffffff">qpopq</text>
<text x="82" y="202">t</text><text x="346" y="202">m</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="400" y="112">the middle character, length 1</text>
<text x="400" y="142">p matches p: length 3</text>
<text x="400" y="172">q matches q: length 5</text>
<text x="400" y="202">t and m differ: stop</text>
</g>
<text x="20" y="230" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">Every other middle stops sooner, so the answer is qpopq, starting at index 1.</text>
</svg>
