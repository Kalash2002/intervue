<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img">
<title>Top K Frequent on [6, -2, 6, 9, -2, 6, 4, 6, -2] with k = 2: values placed in buckets by count, read from the highest count down</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="24">bucket = count (the array has 9 numbers, so counts run 1 to 9)</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="62" y="62">1</text><text x="122" y="62">2</text><text x="182" y="62">3</text><text x="242" y="62">4</text><text x="302" y="62">5</text><text x="362" y="62">6</text><text x="422" y="62">7</text><text x="482" y="62">8</text><text x="542" y="62">9</text>
<text x="62" y="93">9, 4</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="32" y="72" width="60" height="32"/><rect x="92" y="72" width="60" height="32"/>
<rect x="272" y="72" width="60" height="32"/><rect x="332" y="72" width="60" height="32"/><rect x="392" y="72" width="60" height="32"/><rect x="452" y="72" width="60" height="32"/><rect x="512" y="72" width="60" height="32"/>
</g>
<g fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5">
<rect x="152" y="72" width="60" height="32"/><rect x="212" y="72" width="60" height="32"/>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">
<text x="182" y="93">-2</text><text x="242" y="93">6</text>
</g>

<path d="M 572 130 L 150 130" stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#83748f"/></marker></defs>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="168">Counts: 6 appears 4 times, -2 three times, 9 and 4 once each.</text>
<text x="20" y="190">Read from bucket 9 down: 5 to 9 are empty, bucket 4 gives 6,</text>
<text x="20" y="210">bucket 3 gives -2. Two values found, so k = 2 is done.</text>
</g>
</svg>
