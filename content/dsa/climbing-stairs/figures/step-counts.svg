<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
<title>Climbing Stairs, Example 1: counts built upwards from the floor reach 8 on step 5</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">ways(step) = ways(step - 1) + ways(step - 2), the floor counts as one way</text>
<path d="M 40 200 L 120 200 L 120 175 L 200 175 L 200 150 L 280 150 L 280 125 L 360 125 L 360 100 L 440 100 L 440 75 L 520 75" stroke="#83748f" stroke-width="2" fill="none"/>
<text x="80" y="190" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">1</text>
<text x="160" y="165" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">1</text>
<text x="240" y="140" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">2</text>
<text x="320" y="115" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">3</text>
<text x="400" y="90" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">5</text>
<rect x="462" y="48" width="36" height="22" rx="4" fill="#7c3aed"/>
<text x="480" y="64" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#ffffff" text-anchor="middle">8</text>
<text x="80" y="220" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="middle">floor</text>
<text x="160" y="195" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="middle">step 1</text>
<text x="240" y="170" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="middle">step 2</text>
<text x="320" y="145" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="middle">step 3</text>
<text x="400" y="120" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="middle">step 4</text>
<text x="480" y="95" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="middle">step 5</text>
<path d="M 328 98 Q 400 36 466 52" stroke="#83748f" stroke-width="1.2" stroke-dasharray="4 3" fill="none"/>
<path d="M 412 82 Q 440 60 460 58" stroke="#83748f" stroke-width="1.2" fill="none"/>
<text x="520" y="140" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">8 = 5 + 3</text>
<text x="520" y="160" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="start">solid: one step</text>
<text x="520" y="178" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f" text-anchor="start">dashed: two steps</text>
</svg>
