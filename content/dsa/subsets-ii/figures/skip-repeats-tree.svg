<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img">
<title>Subsets II, Example 1 sorted to 1 3 3: each node is one distinct subset, and a second 3 offered at the same step is skipped</title>
<g stroke="#83748f" stroke-width="1.5" fill="none">
<path d="M 320 46 L 160 84"/><path d="M 320 46 L 400 84"/>
<path d="M 160 106 L 110 144"/><path d="M 400 106 L 400 144"/>
<path d="M 110 166 L 110 204"/>
</g>
<g stroke="#83748f" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
<path d="M 320 46 L 540 84"/><path d="M 160 106 L 250 144"/>
</g>
<rect x="372" y="146" width="56" height="22" rx="4" fill="#7c3aed"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="320" y="40">[]</text>
<text x="160" y="100">[1]</text><text x="400" y="100">[3]</text><text x="540" y="100">3 again: skip</text>
<text x="110" y="160">[1,3]</text><text x="400" y="160" fill="#ffffff">[3,3]</text><text x="250" y="160">3 again: skip</text>
<text x="110" y="220">[1,3,3]</text>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="252">Each node is a distinct subset: 6 nodes, 6 answers.</text>
<text x="20" y="274">Dashed: the second 3 offered at a step where the first 3 was tried.</text>
<text x="20" y="296">Purple: [3,3], reached only by taking the second 3 after the first.</text>
</g>
</svg>
