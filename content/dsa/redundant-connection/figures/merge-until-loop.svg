<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" role="img">
<title>Redundant Connection, Example 1: cables merge groups until 1-0 joins two buildings already connected</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">cables = [3,4], [0,3], [4,1], [1,0], [2,1]</text>
<path d="M 140 80 L 220 80" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 240 100 L 240 170" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 220 190 L 140 190" stroke="#83748f" stroke-width="1.5" fill="none"/>
<path d="M 120 170 L 120 100" stroke="#7c3aed" stroke-width="3" fill="none"/>
<path d="M 60 190 L 100 190" stroke="#83748f" stroke-width="1.5" fill="none" stroke-dasharray="4 4"/>
<circle cx="120" cy="80" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="120" y="85" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">0</text>
<circle cx="240" cy="80" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="240" y="85" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">3</text>
<circle cx="240" cy="190" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="240" y="195" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">4</text>
<circle cx="120" cy="190" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="120" y="195" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">1</text>
<circle cx="40" cy="190" r="20" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="40" y="195" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">2</text>
<text x="180" y="68" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">2nd</text>
<text x="252" y="140" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="start">1st</text>
<text x="180" y="210" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">3rd</text>
<text x="110" y="140" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#7c3aed" text-anchor="end">4th</text>
<text x="330" y="70" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">1. 3-4  merge {3} and {4}</text>
<text x="330" y="100" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">2. 0-3  group {0, 3, 4}</text>
<text x="330" y="130" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">3. 4-1  group {0, 1, 3, 4}</text>
<rect x="322" y="143" width="290" height="26" rx="4" fill="#7c3aed"/>
<text x="330" y="160" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="start">4. 1-0  same group: answer [1, 0]</text>
<text x="330" y="190" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">5. 2-1  never read</text>
<text x="20" y="250" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">The loop 0, 3, 4, 1 is complete only when its last listed cable arrives.</text>
</svg>
