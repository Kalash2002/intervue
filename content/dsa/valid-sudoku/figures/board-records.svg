<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="330" y="40">Cell (row 2, column 7) holds 5.</text>
<text x="330" y="80">row 2 has seen: 8, 2</text>
<text x="330" y="106">column 7 has seen: nothing</text>
<text x="330" y="132">box 2 has seen: 7, 3</text>
<text x="330" y="152" font-size="12">box = 2 / 3 * 3 + 7 / 3 = 2</text>
<text x="330" y="196">5 is in none of the three, so the</text>
<text x="330" y="216">cell is fine. Mark 5 in row 2,</text>
<text x="330" y="236">column 7 and box 2, then go on.</text>
</g>
