<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img">
<title>Pacific Atlantic Water Flow, Example 1: each cell of the 3 by 3 map marked with the oceans its water reaches</title>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="70" y="26">Pacific (top and left edges)</text>
<text x="70" y="226">Atlantic (bottom and right edges)</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="70" y="40" width="54" height="54"/><rect x="124" y="40" width="54" height="54"/><rect x="178" y="40" width="54" height="54"/>
<rect x="70" y="94" width="54" height="54"/><rect x="124" y="94" width="54" height="54"/><rect x="178" y="94" width="54" height="54"/>
<rect x="70" y="148" width="54" height="54"/><rect x="124" y="148" width="54" height="54"/><rect x="178" y="148" width="54" height="54"/>
<line x1="60" y1="36" x2="236" y2="36" stroke-width="4"/><line x1="64" y1="36" x2="64" y2="206" stroke-width="4"/>
<line x1="66" y1="208" x2="240" y2="208" stroke-dasharray="6 4" stroke-width="4"/><line x1="238" y1="38" x2="238" y2="206" stroke-dasharray="6 4" stroke-width="4"/>
</g>
<g fill="#7c3aed">
<rect x="179" y="41" width="52" height="52"/><rect x="125" y="95" width="52" height="52"/><rect x="71" y="149" width="52" height="52"/>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="18" fill="#83748f" text-anchor="middle">
<text x="97" y="68">1</text><text x="151" y="68">3</text><text x="205" y="68" fill="#ffffff">4</text>
<text x="97" y="122">2</text><text x="151" y="122" fill="#ffffff">5</text><text x="205" y="122">3</text>
<text x="97" y="176" fill="#ffffff">6</text><text x="151" y="176">2</text><text x="205" y="176">1</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="middle">
<text x="97" y="86">P</text><text x="151" y="86">P</text><text x="205" y="86" fill="#ffffff">P A</text>
<text x="97" y="140">P</text><text x="151" y="140" fill="#ffffff">P A</text><text x="205" y="140">A</text>
<text x="97" y="194" fill="#ffffff">P A</text><text x="151" y="194">A</text><text x="205" y="194">A</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">
<text x="280" y="64">Pacific search: start on the solid edges,</text>
<text x="280" y="82">climb to neighbours at least as high: + the 5</text>
<text x="280" y="116">Atlantic search: start on the dashed edges,</text>
<text x="280" y="134">climb the same way: + the 5</text>
<text x="280" y="168">answer: cells reached by both searches</text>
<text x="280" y="186">[0,2], [1,1], [2,0]</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="254">Purple: the cells whose rain reaches both oceans. P, A: reached by that search.</text>
</g>
</svg>
