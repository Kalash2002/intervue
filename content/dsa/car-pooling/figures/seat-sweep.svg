<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img">
<title>Car Pooling, Example 1: the people aboard at each event minute reach 5 at minute 4, over 4 seats</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">seats = 4; groups of 3 (minutes 2 to 6) and 2 (minutes 4 to 9)</text>
<text x="10" y="56" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">3 riders</text>
<rect x="100" y="40" width="200" height="22" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="106" y="56" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">2 to 6</text>
<text x="10" y="100" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">2 riders</text>
<rect x="200" y="84" width="250" height="22" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="206" y="100" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">4 to 9</text>
<path d="M 60 150 L 600 150" stroke="#83748f" stroke-width="1.5" fill="none"/>
<circle cx="100" cy="150" r="4" fill="#7c3aed"/>
<text x="100" y="172" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">2</text>
<circle cx="200" cy="150" r="4" fill="#7c3aed"/>
<text x="200" y="172" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">4</text>
<circle cx="300" cy="150" r="4" fill="#7c3aed"/>
<text x="300" y="172" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">6</text>
<circle cx="450" cy="150" r="4" fill="#7c3aed"/>
<text x="450" y="172" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">9</text>
<text x="10" y="198" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">aboard</text>
<rect x="78" y="180" width="44" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="100" y="198" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">3</text>
<rect x="178" y="180" width="44" height="26" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="200" y="198" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">5</text>
<rect x="278" y="180" width="44" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="300" y="198" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">2</text>
<rect x="428" y="180" width="44" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="450" y="198" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">0</text>
<text x="20" y="246" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">The running total passes 4 at minute 4, so the answer is false.</text>
<text x="20" y="268" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">With 5 seats the same total fits, and the answer would be true.</text>
</svg>
