<text x="20" y="314" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">p kept, l deleted, a s t e kept, r replaced by l: 2 fixes</text>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="20" y="334">Row 0 and column 0 count the letters to insert or delete. A cell whose two letters are equal</text><text x="20" y="352">copies the cell up and to the left; any other is 1 more than the least of up-left, up and left.</text></g>
