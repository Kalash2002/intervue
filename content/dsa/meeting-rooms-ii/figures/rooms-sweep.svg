<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img">
<title>Meeting Rooms II, Example 1: rooms in use at each event minute, peaking at 2</title>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">bookings 9 to 11, 10 to 12 and 11 to 13 (end exclusive)</text>
<text x="10" y="56" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">booking 1</text>
<rect x="100" y="40" width="120" height="22" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="106" y="56" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">9 to 11</text>
<text x="10" y="100" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">booking 2</text>
<rect x="160" y="84" width="120" height="22" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="166" y="100" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">10 to 12</text>
<text x="10" y="144" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">booking 3</text>
<rect x="220" y="128" width="120" height="22" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="226" y="144" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="start">11 to 13</text>
<path d="M 60 184 L 600 184" stroke="#83748f" stroke-width="1.5" fill="none"/>
<circle cx="100" cy="184" r="4" fill="#7c3aed"/>
<text x="100" y="206" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">9</text>
<circle cx="160" cy="184" r="4" fill="#7c3aed"/>
<text x="160" y="206" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">10</text>
<circle cx="220" cy="184" r="4" fill="#7c3aed"/>
<text x="220" y="206" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">11</text>
<circle cx="280" cy="184" r="4" fill="#7c3aed"/>
<text x="280" y="206" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">12</text>
<circle cx="340" cy="184" r="4" fill="#7c3aed"/>
<text x="340" y="206" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">13</text>
<text x="10" y="232" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f" text-anchor="start">in use</text>
<rect x="78" y="214" width="44" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="100" y="232" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">1</text>
<rect x="138" y="214" width="44" height="26" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="160" y="232" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#ffffff" text-anchor="middle">2</text>
<rect x="198" y="214" width="44" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="220" y="232" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">2</text>
<rect x="258" y="214" width="44" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="280" y="232" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">1</text>
<rect x="318" y="214" width="44" height="26" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="340" y="232" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">0</text>
<text x="20" y="274" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f" text-anchor="start">At 11 one ends and one starts: the end goes first, so the count stays 2.</text>
</svg>
