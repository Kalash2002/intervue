<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" width="640" height="312" role="img">
<title>Network Delay Time on Example 1: earliest arrival times 0, 3, 7 and 8, with the link 0 to 2 of delay 9 never used</title>

<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#83748f"/></marker></defs>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f"><text x="20" y="22">nodes with their earliest arrival time; link labels are delays</text></g>

<path d="M 77.0 113.9 L 180.2 77.1" stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 217.0 76.1 L 320.2 112.9" stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<path d="M 78.0 120.0 L 319.0 120.0" stroke="#83748f" stroke-width="1.5" fill="none" stroke-dasharray="4 3" opacity="0.5" marker-end="url(#a)"/>
<path d="M 358.0 120.0 L 459.0 120.0" stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
<g fill="none" stroke="#83748f" stroke-width="1.5">
<circle cx="60" cy="120" r="18"/>
<circle cx="200" cy="70" r="18"/>
<circle cx="340" cy="120" r="18"/>
</g>
<circle cx="480" cy="120" r="18" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#83748f" text-anchor="middle">
<text x="60" y="125">0</text>
<text x="200" y="75">1</text>
<text x="340" y="125">2</text>
<text x="480" y="125" fill="#ffffff">3</text>
</g><g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle">
<text x="60" y="92">t=0</text>
<text x="200" y="42">t=3</text>
<text x="340" y="92">t=7</text>
<text x="480" y="92">t=8</text>
<text x="118" y="88">3</text>
<text x="286" y="86">4</text>
<text x="200" y="146" opacity="0.7">9</text>
<text x="410" y="146">1</text>
</g><g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">
<text x="20" y="188">priority queue, as (time, node):</text>
<text x="20" y="208">pop (0, node 0): queue (3, node 1) and (9, node 2)</text>
<text x="20" y="228">pop (3, node 1): 3+4 = 7 beats 9, queue (7, node 2)</text>
<text x="20" y="248">pop (7, node 2): queue (8, node 3)</text>
<text x="20" y="268">pop (8, node 3): the last node, answer 8</text>
<text x="20" y="288">pop (9, node 2): stale, 9 is above 7, skipped</text>
</g></svg>
