<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" width="640" height="262" role="img">
<title>Unique Paths, Example 1: the number of routes into every cell of a 4 by 5 floor</title>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#83748f"/></marker></defs>
<text x="20" y="24" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">rows = 4, cols = 5: the routes into each cell, filled row by row</text>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="11" fill="#83748f" text-anchor="end"><text x="156" y="63">row 0</text><text x="156" y="105">row 1</text><text x="156" y="147">row 2</text><text x="156" y="189">row 3</text></g>
<g fill="none" stroke="#83748f" stroke-width="1.5"><rect x="170" y="44" width="52" height="28"/><rect x="238" y="44" width="52" height="28"/><rect x="306" y="44" width="52" height="28"/><rect x="374" y="44" width="52" height="28"/><rect x="442" y="44" width="52" height="28"/><rect x="170" y="86" width="52" height="28"/><rect x="238" y="86" width="52" height="28"/><rect x="306" y="86" width="52" height="28"/><rect x="374" y="86" width="52" height="28"/><rect x="442" y="86" width="52" height="28"/><rect x="170" y="128" width="52" height="28"/><rect x="238" y="128" width="52" height="28"/><rect x="306" y="128" width="52" height="28"/><rect x="374" y="128" width="52" height="28"/><rect x="442" y="128" width="52" height="28" stroke-width="2.5"/><rect x="170" y="170" width="52" height="28"/><rect x="238" y="170" width="52" height="28"/><rect x="306" y="170" width="52" height="28"/><rect x="374" y="170" width="52" height="28" stroke-width="2.5"/></g>
<rect x="442" y="170" width="52" height="28" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle"><text x="196" y="63">1</text><text x="264" y="63">1</text><text x="332" y="63">1</text><text x="400" y="63">1</text><text x="468" y="63">1</text><text x="196" y="105">1</text><text x="264" y="105">2</text><text x="332" y="105">3</text><text x="400" y="105">4</text><text x="468" y="105">5</text><text x="196" y="147">1</text><text x="264" y="147">3</text><text x="332" y="147">6</text><text x="400" y="147">10</text><text x="468" y="147">15</text><text x="196" y="189">1</text><text x="264" y="189">4</text><text x="332" y="189">10</text><text x="400" y="189">20</text><text x="468" y="189" fill="#ffffff">35</text></g>
<line x1="468" y1="157" x2="468" y2="169" stroke="#83748f" stroke-width="1.5" marker-end="url(#head)"/>
<line x1="427" y1="184" x2="441" y2="184" stroke="#83748f" stroke-width="1.5" marker-end="url(#head)"/>
<text x="504" y="189" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">goal</text>
<text x="20" y="226" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">ways[3][4] = ways[2][4] + ways[3][3] = 15 + 20 = 35</text>
<text x="20" y="250" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">The start is the top-left cell. Each cell adds the cell above it and the cell to its left.</text>
</svg>
