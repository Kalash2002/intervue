<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img">
<title>Clone Graph, Example 1: the triangle with a tail holding 6, 2, 6, 9, 2, the map from each original node to its copy, and the copied graph</title>

<g stroke="#83748f" stroke-width="1.5" fill="none">
<line x1="70" y1="50" x2="130" y2="50"/><line x1="61" y1="67" x2="89" y2="108"/><line x1="111" y1="108" x2="139" y2="67"/>
<line x1="161" y1="67" x2="189" y2="108"/><line x1="200" y1="145" x2="200" y2="175"/>
<circle cx="150" cy="50" r="20"/><circle cx="100" cy="125" r="20"/><circle cx="200" cy="125" r="20"/><circle cx="200" cy="195" r="20"/>
<line x1="470" y1="50" x2="530" y2="50"/><line x1="461" y1="67" x2="489" y2="108"/><line x1="511" y1="108" x2="539" y2="67"/>
<line x1="561" y1="67" x2="589" y2="108"/><line x1="600" y1="145" x2="600" y2="175"/>
<circle cx="550" cy="50" r="20"/><circle cx="500" cy="125" r="20"/><circle cx="600" cy="125" r="20"/><circle cx="600" cy="195" r="20"/>
</g>
<g fill="#7c3aed"><circle cx="50" cy="50" r="20"/><circle cx="450" cy="50" r="20"/></g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#83748f" text-anchor="middle">
<text x="50" y="55" fill="#ffffff">6</text><text x="150" y="55">6</text><text x="100" y="130">2</text><text x="200" y="130">9</text><text x="200" y="200">2</text>
<text x="450" y="55" fill="#ffffff">6</text><text x="550" y="55">6</text><text x="500" y="130">2</text><text x="600" y="130">9</text><text x="600" y="200">2</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">
<text x="50" y="22">n0</text><text x="150" y="22">n2</text><text x="100" y="164">n1</text>
<text x="450" y="22">c0</text><text x="550" y="22">c2</text><text x="500" y="164">c1</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="end">
<text x="174" y="130">n3</text><text x="174" y="200">n4</text>
<text x="574" y="130">c3</text><text x="574" y="200">c4</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="250" y="60">made in this order:</text>
<text x="250" y="84">n0 -&gt; c0 (start)</text>
<text x="250" y="106">n2 -&gt; c2 (from n0)</text>
<text x="250" y="128">n1 -&gt; c1 (from n0)</text>
<text x="250" y="150">n3 -&gt; c3 (from n2)</text>
<text x="250" y="172">n4 -&gt; c4 (from n3)</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="234">Left the input, right the copy; purple: the start and the copy returned.</text>
<text x="20" y="254">n0 and n2 both hold 6 but are different keys, so each gets its own copy.</text>
</g>
</svg>
