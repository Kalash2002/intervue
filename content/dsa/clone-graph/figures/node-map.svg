<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260" role="img">
<title>Clone Graph, Example 1: the ring 5, 8, 3, 8, the map from each original node to its copy, and the copied ring</title>

<g stroke="#83748f" stroke-width="1.5" fill="none">
<line x1="82" y1="60" x2="138" y2="60"/><line x1="160" y1="82" x2="160" y2="138"/>
<line x1="138" y1="160" x2="82" y2="160"/><line x1="60" y1="138" x2="60" y2="82"/>
<circle cx="160" cy="60" r="22"/><circle cx="160" cy="160" r="22"/><circle cx="60" cy="160" r="22"/>
<line x1="482" y1="60" x2="538" y2="60"/><line x1="560" y1="82" x2="560" y2="138"/>
<line x1="538" y1="160" x2="482" y2="160"/><line x1="460" y1="138" x2="460" y2="82"/>
<circle cx="560" cy="60" r="22"/><circle cx="560" cy="160" r="22"/><circle cx="460" cy="160" r="22"/>
</g>
<g fill="#7c3aed"><circle cx="60" cy="60" r="22"/><circle cx="460" cy="60" r="22"/></g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="15" fill="#83748f" text-anchor="middle">
<text x="60" y="65" fill="#ffffff">5</text><text x="160" y="65">8</text><text x="160" y="165">3</text><text x="60" y="165">8</text>
<text x="460" y="65" fill="#ffffff">5</text><text x="560" y="65">8</text><text x="560" y="165">3</text><text x="460" y="165">8</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle">
<text x="60" y="28">n0</text><text x="160" y="28">n1</text><text x="160" y="200">n2</text><text x="60" y="200">n3</text>
<text x="460" y="28">c0</text><text x="560" y="28">c1</text><text x="560" y="200">c2</text><text x="460" y="200">c3</text>
</g>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f">
<text x="230" y="60">map, in the order made</text>
<text x="230" y="88">n0 -&gt; c0  (start)</text>
<text x="230" y="110">n1 -&gt; c1  (from n0)</text>
<text x="230" y="132">n3 -&gt; c3  (from n0)</text>
<text x="230" y="154">n2 -&gt; c2  (from n1)</text>
</g>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="14" fill="#83748f">
<text x="20" y="234">Left the input, right the copy; purple: the start and the copy returned.</text>
<text x="20" y="254">n1 and n3 both hold 8 but are different keys, so each gets its own copy.</text>
</g>
</svg>
