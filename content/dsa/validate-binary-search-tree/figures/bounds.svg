<text x="111.5" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="11" text-anchor="end" fill="#83748f">(-inf,41)</text>
<circle cx="317.5" cy="100" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="317.5" y="105" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">63</text>
<text x="338.5" y="104" font-family="JetBrains Mono, Consolas, monospace" font-size="11" text-anchor="start" fill="#83748f">(41,+inf)</text>
<circle cx="86.2" cy="160" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="86.2" y="165" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">8</text>
<text x="86.2" y="191" font-family="JetBrains Mono, Consolas, monospace" font-size="11" text-anchor="middle" fill="#83748f">(-inf,17)</text>
<circle cx="178.8" cy="160" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="178.8" y="165" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">29</text>
<text x="178.8" y="191" font-family="JetBrains Mono, Consolas, monospace" font-size="11" text-anchor="middle" fill="#83748f">(17,41)</text>
<circle cx="271.2" cy="160" r="16" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="271.2" y="165" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#ffffff">50</text>
<text x="271.2" y="191" font-family="JetBrains Mono, Consolas, monospace" font-size="11" text-anchor="middle" fill="#83748f">(41,63)</text>
<circle cx="363.8" cy="160" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
