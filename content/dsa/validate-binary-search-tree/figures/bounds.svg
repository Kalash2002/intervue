<text x="363.8" y="191" font-family="JetBrains Mono, Consolas, monospace" font-size="11" text-anchor="middle" fill="#83748f">(63,+inf)</text>
<text x="430" y="50" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">each node must lie strictly</text>
<text x="430" y="70" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">inside the range its ancestors set</text>
<text x="430" y="110" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">50 lies in (41,63): fine; a 35 there</text>
<text x="430" y="130" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">would suit its parent 63 but not 41</text>
