<line x1="307.7" y1="112.7" x2="281.0" y2="147.3" stroke="#83748f" stroke-width="1.5"/>
<line x1="327.3" y1="112.7" x2="354.0" y2="147.3" stroke="#83748f" stroke-width="1.5"/>
<circle cx="225.0" cy="40" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="225.0" y="45" font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">41</text>
<circle cx="132.5" cy="100" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
