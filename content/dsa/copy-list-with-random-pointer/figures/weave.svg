<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
<title>The list 6, 1, 9, 4 woven with its copies; the copy of 6 gets its random link as 9.next, the copy of 9</title>
<defs>
<marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#83748f"/></marker>
<marker id="p" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7c3aed"/></marker>
</defs>

<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="160" y="30">random of 6 in the input: 9</text>
<text x="20" y="226">copy of 6: random = 9.next, the copy of 9</text>
</g>

<g fill="none" stroke="#83748f" stroke-width="1.5">
<rect x="30" y="100" width="44" height="28"/>
<rect x="182" y="100" width="44" height="28"/><rect x="258" y="100" width="44" height="28" stroke-dasharray="4 3"/>
<rect x="334" y="100" width="44" height="28"/><rect x="410" y="100" width="44" height="28" stroke-dasharray="4 3"/>
<rect x="486" y="100" width="44" height="28"/><rect x="562" y="100" width="44" height="28" stroke-dasharray="4 3"/>
</g>
<rect x="106" y="100" width="44" height="28" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>

<g stroke="#83748f" stroke-width="1.5" fill="none" marker-end="url(#a)">
<path d="M 74 114 L 102 114"/><path d="M 150 114 L 178 114"/><path d="M 226 114 L 254 114"/>
<path d="M 302 114 L 330 114"/><path d="M 378 114 L 406 114"/><path d="M 454 114 L 482 114"/>
<path d="M 530 114 L 558 114"/>
<path d="M 52 100 C 52 44, 356 44, 356 96"/>
</g>
<path d="M 128 128 C 128 196, 432 196, 432 132" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#p)"/>

<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle">
<text x="52" y="119">6</text><text x="128" y="119" fill="#ffffff">6'</text>
<text x="204" y="119">1</text><text x="280" y="119">1'</text>
<text x="356" y="119">9</text><text x="432" y="119">9'</text>
<text x="508" y="119">4</text><text x="584" y="119">4'</text>
</g>
</svg>
