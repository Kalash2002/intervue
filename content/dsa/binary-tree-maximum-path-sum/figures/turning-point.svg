<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" role="img">
<title>Example 1: the best path 7, 9, -4, 6, -5, 8 turns at the root -4, which adds 16 from its left and 9 from its right to its own value</title>
<g stroke="#83748f">
<line x1="306" y1="38" x2="214" y2="81" stroke-width="3.5"/>
<line x1="334" y1="38" x2="426" y2="81" stroke-width="3.5"/>
<line x1="190" y1="97" x2="150" y2="128" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="210" y1="97" x2="250" y2="128" stroke-width="3.5"/>
<line x1="450" y1="97" x2="490" y2="128" stroke-width="3.5"/>
<line x1="494" y1="154" x2="476" y2="181" stroke-width="3.5"/>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" text-anchor="middle" fill="#83748f">
<circle cx="320" cy="30" r="16" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<text x="320" y="35" fill="#ffffff">-4</text>
<circle cx="200" cy="88" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="200" y="93">9</text>
<circle cx="440" cy="88" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="440" y="93">6</text>
<circle cx="140" cy="140" r="16" fill="none" stroke="#83748f" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="140" y="145">-2</text>
<circle cx="260" cy="140" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="260" y="145">7</text>
<circle cx="500" cy="140" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="500" y="145">-5</text>
<circle cx="470" cy="195" r="16" fill="none" stroke="#83748f" stroke-width="1.5"/>
<text x="470" y="200">8</text>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f">
<text x="176" y="80" text-anchor="end">hands up 16</text>
<text x="464" y="80">hands up 9</text>
<text x="524" y="136">hands up 3</text>
<text x="494" y="208">hands up 8</text>
<text x="284" y="160">hands up 7</text>
<text x="116" y="168" text-anchor="middle">-2: floored to 0</text>
</g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">
<text x="20" y="208">candidate at -4: -4 + 16 + 9 = 21, the best</text>
<text x="20" y="228">thick lines: the path 7, 9, -4, 6, -5, 8</text>
</g>
</svg>
