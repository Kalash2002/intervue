<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" width="640" height="368" role="img">
<title>Burst Balloons, Example 1: the padded row 1 2 3 7 4 2 1, the 7 burst last, and the table of the most coins between two standing balloons</title>
<text x="20" y="22" font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="13" fill="#83748f">values = [2, 3, 7, 4, 2], with a 1 added at each end for the missing neighbours</text>
<g fill="none" stroke="#83748f" stroke-width="1.5"><circle cx="76" cy="66" r="18" stroke-dasharray="4 3"/><circle cx="134" cy="66" r="18"/><circle cx="192" cy="66" r="18"/><circle cx="308" cy="66" r="18"/><circle cx="366" cy="66" r="18"/><circle cx="424" cy="66" r="18" stroke-dasharray="4 3"/></g>
<circle cx="250" cy="66" r="18" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#83748f" text-anchor="middle"><text x="76" y="71">1</text><text x="134" y="71">2</text><text x="192" y="71">3</text><text x="250" y="71" fill="#ffffff">7</text><text x="308" y="71">4</text><text x="366" y="71">2</text><text x="424" y="71">1</text></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#83748f" text-anchor="middle"><text x="76" y="100">0</text><text x="134" y="100">1</text><text x="192" y="100">2</text><text x="250" y="100">3</text><text x="308" y="100">4</text><text x="366" y="100">5</text><text x="424" y="100">6</text></g>
<g fill="none" stroke="#83748f" stroke-width="1.5"><path d="M116 110 V116 H210 V110"/><path d="M290 110 V116 H384 V110"/></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle"><text x="163" y="134">best[0][3] = 56</text><text x="337" y="134">best[3][6] = 70</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="490" y="56">the 7 bursts last,</text><text x="490" y="74">so it pays 1 × 7 × 1</text><text x="490" y="92">and the two sides</text><text x="490" y="110">never meet</text></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="middle"><text x="126" y="170">hi 2</text><text x="182" y="170">hi 3</text><text x="238" y="170">hi 4</text><text x="294" y="170">hi 5</text><text x="350" y="170">hi 6</text></g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f" text-anchor="end"><text x="90" y="197">lo 0</text><text x="90" y="225">lo 1</text><text x="90" y="253">lo 2</text><text x="90" y="281">lo 3</text><text x="90" y="309">lo 4</text></g>
<g fill="none" stroke="#83748f" stroke-width="1"><rect x="100" y="180" width="52" height="24"/><rect x="212" y="180" width="52" height="24"/><rect x="268" y="180" width="52" height="24"/><rect x="156" y="208" width="52" height="24"/><rect x="212" y="208" width="52" height="24"/><rect x="268" y="208" width="52" height="24"/><rect x="324" y="208" width="52" height="24"/><rect x="212" y="236" width="52" height="24"/><rect x="268" y="236" width="52" height="24"/><rect x="324" y="236" width="52" height="24"/><rect x="268" y="264" width="52" height="24"/><rect x="324" y="292" width="52" height="24"/></g>
<g fill="none" stroke="#83748f" stroke-width="2.5"><rect x="156" y="180" width="52" height="24"/><rect x="324" y="264" width="52" height="24"/></g>
<rect x="324" y="180" width="52" height="24" fill="#7c3aed" stroke="#7c3aed" stroke-width="1.5"/>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#83748f" text-anchor="middle"><text x="126" y="197">6</text><text x="182" y="197">56</text><text x="238" y="197">116</text><text x="294" y="197">130</text><text x="350" y="197" fill="#ffffff">133</text><text x="182" y="225">42</text><text x="238" y="225">108</text><text x="294" y="225">126</text><text x="350" y="225">130</text><text x="238" y="253">84</text><text x="294" y="253">108</text><text x="350" y="253">114</text><text x="294" y="281">56</text><text x="350" y="281">70</text><text x="350" y="309">8</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="400" y="197">cell lo, hi: the most coins from</text><text x="400" y="215">the balloons strictly between</text><text x="400" y="233">positions lo and hi, both standing</text><text x="400" y="263">thick: the two sides of the 7</text><text x="400" y="281">highlighted: the whole row</text></g>
<g font-family="Hanken Grotesk, Segoe UI, sans-serif" font-size="12" fill="#83748f"><text x="20" y="340">Each cell tries every balloon k between lo and hi as the last one burst there:</text></g>
<text x="20" y="358" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#83748f">best[lo][k] + v[lo] × v[k] × v[hi] + best[k][hi]; here 56 + 7 + 70 = 133</text>
</svg>
