# One place for every Java dependency version (PLAN.md 5.2). Bump here, nowhere else.
[versions]
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
jackson = "3.2.3"
sqlite = "3.53.4.0"
# 1.37.0 fails inside Spotless 8.10.4 (InvocationTargetException); 1.36.1 is the Spotless default.
googleJavaFormat = "1.36.1"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }

[plugins]
spotless = { id = "com.diffplug.spotless", version = "8.10.4" }
