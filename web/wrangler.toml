# Cloudflare Pages project for the website. `wrangler pages dev` and `wrangler pages deploy` read this file.
name = "intervue-web"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

# Waitlist signups, one key per email (functions/api/waitlist.ts).
# Replace the id with the one printed by `wrangler kv namespace create WAITLIST`; local dev ignores it.
[[kv_namespaces]]
binding = "WAITLIST"
id = "cd93acd604de49f09473569fbebbe362"
